<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🚲 鹈鹕骑自行车 · Pelican on a Bicycle</title>
<style>
  :root{
    --speed: 1;                     /* 全局速度倍率 */
    --pedal: calc(0.9s / var(--speed));   /* 一圈踩踏时间 */
    --road:  calc(0.5s / var(--speed));   /* 路面滚动 */

    --sky-top:#8fd4ff;
    --sky-bot:#ffe6b3;
    --hill-far:#86c98f;
    --hill-near:#5fae72;
    --ground:#caa36a;
    --road-c:#6b6358;
    --sun:#ffd34d;
    --star-op:0;
    --haze:rgba(255,255,255,.35);
  }
  body.night{
    --sky-top:#0b1d3a;
    --sky-bot:#2b2a5e;
    --hill-far:#2b4a55;
    --hill-near:#1d3340;
    --ground:#3a3345;
    --road-c:#2a2534;
    --sun:#f3f1e0;
    --star-op:1;
    --haze:rgba(120,140,255,.18);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;
    background:#11131a;
    font-family:ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:#e8eaf0;
    padding:24px;
  }
  h1{
    margin:0;font-size:clamp(18px,3vw,28px);font-weight:650;letter-spacing:.5px;
    display:flex;align-items:center;gap:.5em;
  }
  h1 small{font-weight:400;opacity:.5;font-size:.6em}

  .stage{
    width:min(960px,100%);
    aspect-ratio: 16 / 9;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.07);
    background:#000;
  }
  svg{display:block;width:100%;height:100%}

  /* ---------- 控件 ---------- */
  .panel{
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    padding:12px 18px;border-radius:999px;
    backdrop-filter:blur(6px);
  }
  .panel label{display:flex;align-items:center;gap:10px;font-size:13px;opacity:.9}
  input[type=range]{width:160px;accent-color:#ffd34d}
  button{
    font:inherit;font-size:13px;cursor:pointer;
    background:rgba(255,255,255,.1);color:inherit;
    border:1px solid rgba(255,255,255,.14);
    padding:7px 14px;border-radius:999px;transition:.2s;
  }
  button:hover{background:rgba(255,255,255,.2)}
  button:active{transform:translateY(1px)}
  .val{font-variant-numeric:tabular-nums;opacity:.6;min-width:3.2em}

  /* ---------- 动画 ---------- */
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes dash{to{stroke-dashoffset:-120}}
  @keyframes scroll-a{from{transform:translateX(0)}to{transform:translateX(-900px)}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-3.5px) rotate(-1.4deg)}}
  @keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  @keyframes thigh{0%,100%{transform:rotate(16deg)}50%{transform:rotate(-16deg)}}
  @keyframes shin{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(26deg)}}
  @keyframes flap{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(12deg)}}
  @keyframes wave{0%,100%{transform:rotate(-7deg) skewY(0deg)}50%{transform:rotate(9deg) skewY(5deg)}}
  @keyframes wiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
  @keyframes drift{from{transform:translateX(900px)}to{transform:translateX(-400px)}}
  @keyframes puff{0%{opacity:.5;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(-70px,-22px) scale(2.2)}}
  @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes sunpulse{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.12);opacity:.6}}

  .wheel-spin{animation:spin var(--pedal) linear infinite}
  .crank{animation:spin var(--pedal) linear infinite}
  .rider{animation:bob var(--pedal) ease-in-out infinite}
  .bike-bounce{animation:bob2 var(--pedal) ease-in-out infinite}
  .thigh{animation:thigh var(--pedal) ease-in-out infinite}
  .shin{animation:shin var(--pedal) ease-in-out infinite}
  .leg-b .thigh,.leg-b .shin{animation-delay:calc(var(--pedal) / -2)}
  .wing{animation:flap calc(var(--pedal) * 2) ease-in-out infinite;transform-box:fill-box}
  .scarf{animation:wave calc(var(--pedal) * 1.5) ease-in-out infinite}
  .fish{animation:wiggle .45s ease-in-out infinite}
  .road-dash{animation:dash var(--road) linear infinite}
  .layer-near{animation:scroll-a calc(var(--road) * 7) linear infinite}
  .layer-far{animation:scroll-a calc(var(--road) * 18) linear infinite}
  .cloud{animation:drift calc(var(--road) * 44) linear infinite}
  .cloud:nth-of-type(2){animation-duration:calc(var(--road) * 62);animation-delay:calc(var(--road) * -20)}
  .cloud:nth-of-type(3){animation-duration:calc(var(--road) * 54);animation-delay:calc(var(--road) * -38)}
  .puff{animation:puff calc(var(--pedal) * 2.2) ease-out infinite}
  .puff:nth-of-type(2){animation-delay:calc(var(--pedal) * -.8)}
  .puff:nth-of-type(3){animation-delay:calc(var(--pedal) * -1.5)}
  .stars{opacity:var(--star-op);transition:opacity .6s}
  .star{animation:twinkle 2.4s ease-in-out infinite}
  .star:nth-child(2n){animation-duration:3.4s;animation-delay:-1s}
  .star:nth-child(3n){animation-duration:1.9s;animation-delay:-.6s}
  .sun-glow{animation:sunpulse 4s ease-in-out infinite;transform-origin:700px 110px}

  body.paused *{animation-play-state:paused !important}

  @media (prefers-reduced-motion: reduce){
    body:not(.force-motion) *{animation:none !important}
  }
</style>
</head>
<body>

<h1>🐦 鹈鹕骑自行车 <small>Pelican on a Bicycle</small></h1>

<div class="stage">
<svg viewBox="0 0 900 506" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="一只戴围巾的鹈鹕骑着自行车在夕阳下的公路上前进">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="var(--sky-top)"/>
      <stop offset="100%" stop-color="var(--sky-bot)"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffb13d"/>
      <stop offset="100%" stop-color="#ff8a2b"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffcf6b"/>
      <stop offset="100%" stop-color="#f4913c"/>
    </linearGradient>
    <linearGradient id="bodyg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="60%"  stop-color="#eef2f7"/>
      <stop offset="100%" stop-color="#cdd6e0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%"   stop-color="var(--sun)" stop-opacity=".85"/>
      <stop offset="100%" stop-color="var(--sun)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--road-c)"/>
      <stop offset="100%" stop-color="var(--ground)"/>
    </linearGradient>

    <!-- 一个车轮：轮胎 + 轮毂 + 辐条 -->
    <g id="wheel">
      <circle r="62" fill="none" stroke="#1d2129" stroke-width="9"/>
      <circle r="62" fill="none" stroke="#3b4350" stroke-width="3"/>
      <g class="wheel-spin" style="transform-origin:0 0">
        <g stroke="#b9c2cf" stroke-width="2.2" opacity=".95">
          <line y1="-56" y2="56"/><line x1="-56" x2="56"/>
          <line x1="-40" y1="-40" x2="40" y2="40"/>
          <line x1="40"  y1="-40" x2="-40" y2="40"/>
          <line x1="-21" y1="-52" x2="21" y2="52"/>
          <line x1="21"  y1="-52" x2="-21" y2="52"/>
          <line x1="-52" y1="-21" x2="52" y2="21"/>
          <line x1="52"  y1="-21" x2="-52" y2="21"/>
        </g>
        <circle r="8" fill="#e63f3f"/>
        <circle r="3.4" fill="#fff" opacity=".8"/>
      </g>
      <circle r="5" fill="#2b313b"/>
    </g>

    <g id="hills-far" fill="var(--hill-far)">
      <path d="M0 400 Q 70 318 150 372 Q 220 300 300 368 Q 380 296 450 372 L450 460 L0 460Z"/>
      <path d="M450 400 Q 520 318 600 372 Q 670 300 750 368 Q 830 296 900 372 L900 460 L450 460Z"/>
    </g>
    <g id="hills-near" fill="var(--hill-near)">
      <path d="M0 418 Q 110 362 230 412 Q 340 356 450 414 L450 470 L0 470Z"/>
      <path d="M450 418 Q 560 362 680 412 Q 790 356 900 414 L900 470 L450 470Z"/>
    </g>
    <g id="trees">
      <g fill="var(--hill-near)" opacity=".95">
        <path d="M60 414 l14-40 14 40z"/><path d="M66 414 l8-54 8 54z"/>
        <path d="M250 410 l16-44 16 44z"/>
        <path d="M520 412 l13-38 13 38z"/>
        <path d="M760 410 l15-42 15 42z"/>
      </g>
    </g>
  </defs>

  <!-- ===== 天空 ===== -->
  <rect width="900" height="506" fill="url(#sky)"/>

  <!-- 星空（夜间） -->
  <g class="stars" fill="#fff">
    <circle class="star" cx="80"  cy="60"  r="1.8"/><circle class="star" cx="160" cy="120" r="1.2"/>
    <circle class="star" cx="240" cy="48"  r="1.5"/><circle class="star" cx="330" cy="100" r="1.1"/>
    <circle class="star" cx="410" cy="56"  r="1.9"/><circle class="star" cx="500" cy="130" r="1.3"/>
    <circle class="star" cx="580" cy="40"  r="1.4"/><circle class="star" cx="650" cy="96"  r="1.7"/>
    <circle class="star" cx="730" cy="52"  r="1.2"/><circle class="star" cx="820" cy="112" r="1.6"/>
    <circle class="star" cx="870" cy="66"  r="1.3"/><circle class="star" cx="120" cy="170" r="1.1"/>
    <circle class="star" cx="300" cy="158" r="1.5"/><circle class="star" cx="690" cy="168" r="1.2"/>
  </g>

  <!-- 太阳 / 月亮 -->
  <circle class="sun-glow" cx="700" cy="110" r="95" fill="url(#glow)"/>
  <circle cx="700" cy="110" r="42" fill="var(--sun)"/>

  <!-- 云 -->
  <g fill="var(--haze)">
    <g class="cloud"><ellipse cx="0" cy="96" rx="46" ry="19"/><ellipse cx="34" cy="88" rx="32" ry="22"/><ellipse cx="-30" cy="90" rx="26" ry="15"/></g>
    <g class="cloud"><ellipse cx="0" cy="162" rx="54" ry="16"/><ellipse cx="-26" cy="152" rx="30" ry="20"/></g>
    <g class="cloud"><ellipse cx="0" cy="58" rx="36" ry="13"/><ellipse cx="24" cy="50" rx="24" ry="16"/></g>
  </g>

  <!-- ===== 远景山丘（视差） ===== -->
  <g class="layer-far"><use href="#hills-far"/><use href="#hills-far" x="900"/></g>
  <g class="layer-near"><use href="#hills-near"/><use href="#hills-near" x="900"/>
                        <use href="#trees"/><use href="#trees" x="900"/></g>

  <!-- ===== 地面与公路 ===== -->
  <rect y="430" width="900" height="76" fill="url(#rd)"/>
  <rect y="430" width="900" height="5" fill="#000" opacity=".22"/>
  <line class="road-dash" x1="0" y1="470" x2="900" y2="470"
        stroke="#f6f1e2" stroke-width="5" stroke-linecap="round"
        stroke-dasharray="46 34" opacity=".85"/>

  <!-- 尾气 / 尘土 -->
  <g fill="#fff" opacity=".45">
    <circle class="puff" cx="240" cy="418" r="9"/>
    <circle class="puff" cx="250" cy="424" r="7"/>
    <circle class="puff" cx="232" cy="412" r="11"/>
  </g>

  <!-- ===== 自行车 + 鹈鹕 ===== -->
  <g class="bike-bounce">
    <!-- 阴影 -->
    <ellipse cx="400" cy="420" rx="170" ry="13" fill="#000" opacity=".2"/>

    <!-- 车轮 -->
    <use href="#wheel" x="280" y="358"/>
    <use href="#wheel" x="560" y="358"/>

    <!-- 车架 -->
    <g fill="none" stroke="#e0483c" stroke-width="11" stroke-linecap="round">
      <path d="M280 358 L420 358"/>            <!-- 下管后段 -->
      <path d="M280 358 L352 262"/>            <!-- 座管支撑 -->
      <path d="M420 358 L352 262"/>            <!-- 座管 -->
      <path d="M420 358 L518 268"/>            <!-- 下管 -->
      <path d="M352 262 L516 258"/>            <!-- 上管 -->
    </g>
    <g fill="none" stroke="#c9382d" stroke-width="9" stroke-linecap="round">
      <path d="M518 268 L560 358"/>            <!-- 前叉 -->
      <path d="M516 258 L524 242"/>            <!-- 头管 -->
    </g>

    <!-- 链条 -->
    <path d="M286 360 Q 350 374 416 362" fill="none" stroke="#5a6372" stroke-width="3.6" stroke-dasharray="5 4"/>
    <circle cx="280" cy="358" r="13" fill="none" stroke="#8e97a5" stroke-width="3"/>

    <!-- 车把 -->
    <g stroke="#2e3440" stroke-width="8" stroke-linecap="round" fill="none">
      <path d="M524 242 L556 230"/>
      <path d="M524 242 L500 226"/>
    </g>
    <circle cx="558" cy="229" r="6" fill="#1f242c"/>
    <circle cx="498" cy="225" r="6" fill="#1f242c"/>
    <!-- 车铃 -->
    <circle cx="540" cy="236" r="7" fill="#ffd34d" stroke="#c99b1f" stroke-width="2"/>

    <!-- 水壶 -->
    <rect x="392" y="300" width="18" height="34" rx="6" fill="#4fb3e8" stroke="#2e86b8" stroke-width="2"
          transform="rotate(-16 401 317)"/>

    <!-- 车座 -->
    <path d="M326 258 Q 352 244 376 256 Q 352 266 326 258 Z" fill="#2e3440"/>

    <!-- 曲柄 + 脚踏 -->
    <g class="crank" style="transform-origin:420px 358px">
      <line x1="420" y1="358" x2="420" y2="330" stroke="#8e97a5" stroke-width="7" stroke-linecap="round"/>
      <line x1="420" y1="358" x2="420" y2="386" stroke="#6e7788" stroke-width="7" stroke-linecap="round"/>
      <rect x="406" y="322" width="28" height="9" rx="3" fill="#20252d"/>
      <rect x="406" y="385" width="28" height="9" rx="3" fill="#20252d"/>
      <circle cx="420" cy="358" r="9" fill="#aab3c0"/>
    </g>

    <!-- ===== 远侧腿（先画，被身体遮住） ===== -->
    <g class="leg leg-b">
      <g class="thigh" style="transform-origin:364px 300px">
        <path d="M364 300 L392 338" stroke="#d9dee6" stroke-width="15" stroke-linecap="round" fill="none"/>
        <g class="shin" style="transform-origin:392px 338px">
          <path d="M392 338 L418 376" stroke="#c6cdd6" stroke-width="11" stroke-linecap="round" fill="none"/>
          <path d="M414 378 q 16 -4 20 6 q -12 6 -22 2 z" fill="#f09a35"/>
        </g>
      </g>
    </g>

    <!-- ===== 鹈鹕 ===== -->
    <g class="rider" style="transform-origin:380px 300px">

      <!-- 远侧翅膀 -->
      <path d="M352 268 q -46 20 -34 56 q 24 10 48 -22 z" fill="#c3ccd8"/>

      <!-- 尾羽 -->
      <path d="M312 284 q -44 -10 -58 10 q 34 16 60 8 z" fill="#dfe5ec"/>
      <path d="M312 292 q -38 2 -50 18 q 30 8 52 -4 z" fill="#c9d2dd"/>

      <!-- 身体 -->
      <ellipse cx="372" cy="286" rx="66" ry="52" fill="url(#bodyg)" stroke="#b9c2cf" stroke-width="1.5"/>
      <!-- 胸腹阴影 -->
      <path d="M330 320 q 44 24 92 -2 q -40 32 -92 2 z" fill="#b6bfcb" opacity=".5"/>

      <!-- 脖子 -->
      <path d="M404 262 q 18 -44 42 -62 q 22 -16 36 2 q -22 6 -34 24 q -14 20 -14 44 z"
            fill="url(#bodyg)" stroke="#b9c2cf" stroke-width="1.5"/>

      <!-- 围巾 -->
      <path d="M418 232 q 28 -16 48 -6 l -6 16 q -20 -8 -40 4 z" fill="#e63f3f"/>
      <g class="scarf" style="transform-origin:420px 240px">
        <path d="M418 238 q -34 4 -60 -8 q -8 14 2 22 q 26 8 56 -2 z" fill="#ff5a4e"/>
        <path d="M416 250 q -28 10 -52 4 q 2 12 14 16 q 24 0 40 -10 z" fill="#d8352b"/>
      </g>

      <!-- 头 -->
      <circle cx="470" cy="200" r="30" fill="#fff" stroke="#b9c2cf" stroke-width="1.5"/>
      <path d="M452 180 q 18 -22 38 -6 q -20 -2 -38 6 z" fill="#f2f5f9"/>

      <!-- 喙 + 喉囊 -->
      <path d="M492 190 q 76 6 92 20 q -78 16 -94 6 z" fill="url(#beak)" stroke="#e07d22" stroke-width="1.5"/>
      <path d="M494 204 q 52 10 82 8 q -24 30 -62 20 q -18 -6 -20 -28 z" fill="url(#pouch)" stroke="#e07d22" stroke-width="1.5"/>
      <!-- 喉囊里的鱼 -->
      <g class="fish" style="transform-origin:528px 222px">
        <ellipse cx="532" cy="224" rx="16" ry="8" fill="#6fd0f2" opacity=".95"/>
        <path d="M516 224 l-11 -7 v 14 z" fill="#6fd0f2" opacity=".95"/>
        <circle cx="539" cy="221" r="2" fill="#123"/>
      </g>
      <line x1="492" y1="196" x2="580" y2="209" stroke="#c96b16" stroke-width="1.6" opacity=".7"/>

      <!-- 眼睛 -->
      <circle cx="480" cy="192" r="6.5" fill="#fff" stroke="#9aa5b4" stroke-width="1"/>
      <circle cx="482" cy="193" r="3.6" fill="#1b2027"/>
      <circle cx="483.4" cy="191.4" r="1.3" fill="#fff"/>
      <path d="M472 182 q 10 -6 18 -2" stroke="#9aa5b4" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- 帽子 -->
      <path d="M444 184 q 24 -40 56 -16 q -28 -4 -56 16 z" fill="#2f6fd0"/>
      <path d="M440 186 q -16 2 -20 10 q 22 6 30 -4 z" fill="#2558ab"/>
      <circle cx="486" cy="164" r="6" fill="#ffd34d"/>

      <!-- 近侧翅膀（握把） -->
      <g class="wing">
        <path d="M398 272 q 48 -6 96 -40 q 14 10 4 24 q -44 36 -98 36 q -14 -10 -2 -20 z"
              fill="#eef2f7" stroke="#b9c2cf" stroke-width="1.5"/>
        <path d="M410 288 q 40 -2 76 -28 q -34 32 -74 36 z" fill="#c7d0db"/>
      </g>
    </g>

    <!-- ===== 近侧腿 ===== -->
    <g class="leg leg-a">
      <g class="thigh" style="transform-origin:370px 304px">
        <path d="M370 304 L398 342" stroke="#f4f7fa" stroke-width="17" stroke-linecap="round" fill="none"/>
        <g class="shin" style="transform-origin:398px 342px">
          <path d="M398 342 L422 380" stroke="#e6ebf1" stroke-width="12" stroke-linecap="round" fill="none"/>
          <path d="M418 382 q 18 -5 22 7 q -14 7 -24 2 z" fill="#ffb13d" stroke="#e07d22" stroke-width="1.2"/>
        </g>
      </g>
    </g>
  </g>

  <!-- 速度线 -->
  <g stroke="#fff" stroke-linecap="round" opacity=".5">
    <line class="road-dash" x1="120" y1="250" x2="210" y2="250" stroke-width="3" stroke-dasharray="30 90"/>
    <line class="road-dash" x1="90"  y1="300" x2="200" y2="300" stroke-width="2" stroke-dasharray="40 80"/>
    <line class="road-dash" x1="140" y1="350" x2="230" y2="350" stroke-width="2.5" stroke-dasharray="24 96"/>
  </g>
</svg>
</div>

<div class="panel">
  <label>速度
    <input id="speed" type="range" min="0.2" max="3" step="0.1" value="1">
    <span class="val" id="speedVal">1.0×</span>
  </label>
  <button id="toggleNight">🌙 切到夜晚</button>
  <button id="togglePause">⏸ 暂停</button>
</div>

<script>
  const root  = document.documentElement;
  const speed = document.getElementById('speed');
  const val   = document.getElementById('speedVal');
  const night = document.getElementById('toggleNight');
  const pause = document.getElementById('togglePause');

  // 尊重系统「减少动态效果」，但用户主动调速即视为想看动画
  document.body.classList.add('force-motion');

  const render = () => {
    root.style.setProperty('--speed', speed.value);
    val.textContent = Number(speed.value).toFixed(1) + '×';
  };
  speed.addEventListener('input', render);
  render();

  night.addEventListener('click', () => {
    const isNight = document.body.classList.toggle('night');
    night.textContent = isNight ? '☀️ 切到白天' : '🌙 切到夜晚';
  });

  pause.addEventListener('click', () => {
    const p = document.body.classList.toggle('paused');
    pause.textContent = p ? '▶ 继续' : '⏸ 暂停';
  });

  // 空格暂停 / 继续
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); pause.click(); }
  });
</script>
</body>
</html>
