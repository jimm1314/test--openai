<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企鹅快线 · Penguin Express</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1230; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
  }
  .stage { position: fixed; inset: 0; }
  #scene { width: 100%; height: 100%; display: block; }
  #scene stop, #scene rect, #scene path, #scene circle, #scene ellipse, #scene line {
    transition: fill .7s ease, stop-color .7s ease, stroke .7s ease;
  }
  .overlay {
    position: fixed; top: 22px; left: 26px; color: var(--text); z-index: 5;
    pointer-events: none; user-select: none;
  }
  .overlay h1 { font-size: 26px; letter-spacing: 1px; font-weight: 800; text-shadow: 0 2px 12px rgba(20,40,60,.2); }
  .overlay p { margin-top: 6px; font-size: 13px; opacity: .75; letter-spacing: .5px; }
  .controls {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 5;
  }
  .controls button {
    border: 1px solid rgba(255,255,255,.4); outline: none; cursor: pointer;
    background: rgba(14, 38, 58, .42); color: #fff; backdrop-filter: blur(8px);
    padding: 8px 16px; border-radius: 999px; font-size: 13px; letter-spacing: .5px;
    transition: transform .15s ease, background .2s ease;
  }
  .controls button:hover { background: rgba(14, 38, 58, .62); transform: translateY(-2px); }
  .hint {
    position: fixed; right: 22px; bottom: 22px; z-index: 5; color: var(--text);
    font-size: 12px; opacity: .55; pointer-events: none; user-select: none; letter-spacing: .5px;
  }
  :root {
    --text: #10344a;
    --sky-1: #a8dcff; --sky-2: #d8f2ff; --sky-3: #fff6e2;
    --sun-core: #ffe9a8; --sun-ray: #ffd76a;
    --mtn-1: #d7ecf7; --mtn-2: #b9d9ec; --mtn-line: #8fb9d4;
    --sea-1: #2f9fc9; --sea-2: #63c2dd;
    --wave-c: rgba(255,255,255,.6);
    --ice: #f4fafd; --ice-line: #b9d4e2; --ice-shade: #d8ebf3;
    --road-1: #f2f9fd; --road-2: #d2e4ee;
    --dash: #9fcbe8; --edge: #ffffff;
    --barrier: #e8f3fa; --barrier-line: #a9c9db;
    --sign: #e2564a; --sign-pole: #7a8b96;
    --cloud: #ffffff;
    --skin: #333a44; --skin-2: #232930; --skin-line: #14181d;
    --belly: #f7fafc; --belly-line: #d9e3ea;
    --beak: #f5a623; --beak-line: #c47f14;
    --scarf: #2fb6a8; --scarf-dark: #1d8f84;
    --frame: #e2564a; --frame-dark: #b23a30;
    --tire: #2b3238; --rim: #e2edf3; --spoke: #a3b8c4; --hub: #546e7a;
    --shadow: rgba(30, 60, 90, .22);
    --basket: #c98f4e; --basket-line: #9c6c33; --fish: #cfe3ee; --fish-line: #7fa9bd;
    --star-op: 0; --sun-op: 1; --moon-op: 0; --aurora-op: 0;
    --flake-c: #ffffff;
  }
  body.night {
    --text: #dff1ff;
    --sky-1: #07102b; --sky-2: #12294d; --sky-3: #2c3f6a;
    --sun-core: #e9edf5; --sun-ray: #b9c6dd;
    --mtn-1: #27405f; --mtn-2: #1a3049; --mtn-line: #12233a;
    --sea-1: #07223a; --sea-2: #0d3a5c;
    --wave-c: rgba(160,210,255,.35);
    --ice: #c9dcf0; --ice-line: #6f8aa3; --ice-shade: #9fbcd6;
    --road-1: #2e3f50; --road-2: #1e2c3a;
    --dash: #a9cfe8; --edge: #c7d3da;
    --barrier: #37506a; --barrier-line: #24405c;
    --sign: #c9453a; --sign-pole: #3d4c58;
    --cloud: #39507a;
    --skin: #2c333c; --skin-2: #1d232a; --skin-line: #101418;
    --belly: #e8eef4; --belly-line: #b6c4cf;
    --beak: #e0952a; --beak-line: #a86a15;
    --scarf: #27a396; --scarf-dark: #18786e;
    --frame: #c9453a; --frame-dark: #992f26;
    --tire: #1c242c; --rim: #8fa0aa; --spoke: #63737d; --hub: #33454f;
    --shadow: rgba(0, 0, 0, .5);
    --basket: #9a6c3c; --basket-line: #6f4c26; --fish: #9fc3d6; --fish-line: #5d89a0;
    --star-op: 1; --sun-op: 0; --moon-op: 1; --aurora-op: .8;
    --flake-c: #eaf6ff;
  }
  .dashmove { animation: dashmove .55s linear infinite; }
  @keyframes dashmove { to { transform: translateX(-160px); } }
  .dashmove2 { animation: dashmove2 .38s linear infinite; }
  @keyframes dashmove2 { to { transform: translateX(-90px); } }
  .trackmove { animation: dashmove2 .42s linear infinite; }
  .barriermove { animation: barriermove .5s linear infinite; }
  @keyframes barriermove { to { transform: translateX(-80px); } }
  .signmove { animation: signmove 2.6s linear infinite; }
  @keyframes signmove { from { transform: translateX(1400px); } to { transform: translateX(-260px); } }
  .wave1 { animation: wavedrift 7s linear infinite; }
  .wave2 { animation: wavedrift2 5s linear infinite; }
  .wave3 { animation: wavedrift3 9s linear infinite; }
  @keyframes wavedrift { to { transform: translateX(-240px); } }
  @keyframes wavedrift2 { to { transform: translateX(-160px); } }
  @keyframes wavedrift3 { to { transform: translateX(-200px); } }
  .mound { animation: moundmove .6s linear infinite; }
  @keyframes moundmove { to { transform: translateX(-300px); } }
  .rays { animation: spin 50s linear infinite; transform-origin: 1050px 120px; transform-box: view-box; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #sunGroup { opacity: var(--sun-op); transition: opacity 1s ease; }
  #moonGroup { opacity: var(--moon-op); transition: opacity 1s ease; }
  .stars { opacity: var(--star-op); transition: opacity 1s ease; }
  .star { fill: #fff; animation: twinkle 3.2s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  .aurora { opacity: var(--aurora-op); transition: opacity 1.4s ease; }
  .aurora-a { animation: auroradrift 11s ease-in-out infinite alternate; }
  .aurora-b { animation: auroradrift2 14s ease-in-out infinite alternate; }
  @keyframes auroradrift { from { transform: translateX(-60px); } to { transform: translateX(60px); } }
  @keyframes auroradrift2 { from { transform: translateX(40px); } to { transform: translateX(-70px); } }
  .clouda { animation: clouddrift 46s linear infinite; }
  .cloudb { animation: clouddrift 64s linear infinite; animation-delay: -22s; }
  .cloudc { animation: clouddrift 80s linear infinite; animation-delay: -50s; }
  .cloudd { animation: clouddrift 38s linear infinite; animation-delay: -8s; }
  @keyframes clouddrift { from { transform: translateX(1420px); } to { transform: translateX(-420px); } }
  .birda { animation: birdfly 30s linear infinite; }
  .birdb { animation: birdfly 44s linear infinite; animation-delay: -18s; }
  @keyframes birdfly { from { transform: translateX(1420px); } to { transform: translateX(-300px); } }
  .floea { animation: floemove 40s linear infinite; }
  .floeb { animation: floemove 55s linear infinite; animation-delay: -25s; }
  .floec { animation: floemove 34s linear infinite; animation-delay: -12s; }
  @keyframes floemove { from { transform: translateX(1450px); } to { transform: translateX(-320px); } }
  .floebob { animation: boatbob 3.6s ease-in-out infinite; }
  @keyframes boatbob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
  .penguina { animation: penguinwave 5s ease-in-out infinite; transform-origin: 0 0; }
  .penguinb { animation: penguinwave 5s ease-in-out infinite; animation-delay: -2.5s; transform-origin: 0 0; }
  @keyframes penguinwave {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-6px) rotate(-4deg); }
    60% { transform: translateY(0) rotate(0deg); }
  }
  .flake { animation: snowfall linear infinite; }
  .sway { animation: sway ease-in-out infinite alternate; }
  @keyframes snowfall { from { transform: translateY(-40px); } to { transform: translateY(760px); } }
  @keyframes sway { from { transform: translateX(-22px); } to { transform: translateX(22px); } }
  .speedline { animation: speedline .55s linear infinite; opacity: 0; }
  .speedline.s2 { animation-duration: .7s; animation-delay: -0.2s; }
  .speedline.s3 { animation-duration: .48s; animation-delay: -0.35s; }
  .speedline.s4 { animation-duration: .62s; animation-delay: -0.1s; }
  .speedline.s5 { animation-duration: .52s; animation-delay: -0.42s; }
  @keyframes speedline {
    0% { transform: translateX(0); opacity: 0; }
    12% { opacity: .8; }
    85% { opacity: .5; }
    100% { transform: translateX(-900px); opacity: 0; }
  }
  .puff { animation: puff 3.2s ease-out infinite; opacity: 0; }
  .puff.p2 { animation-delay: 1.6s; }
  @keyframes puff {
    0% { transform: translate(0,0) scale(.4); opacity: 0; }
    18% { opacity: .85; }
    100% { transform: translate(70px,-46px) scale(1.9); opacity: 0; }
  }
  #rig, #bodyG, #headG, #wheelRear, #wheelFront { will-change: transform; }
  .paused .dashmove, .paused .dashmove2, .paused .trackmove, .paused .barriermove,
  .paused .mound, .paused .wave1, .paused .wave2, .paused .wave3, .paused .speedline,
  .paused .clouda, .paused .cloudb, .paused .cloudc, .paused .cloudd,
  .paused .birda, .paused .birdb, .paused .flake, .paused .sway,
  .paused .floea, .paused .floeb, .paused .floec, .paused .rays,
  .paused .penguina, .paused .penguinb, .paused .signmove, .paused .puff,
  .paused .aurora-a, .paused .aurora-b { animation-play-state: paused; }
</style>
</head>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var rig = $("rig"), bodyG = $("bodyG"), headG = $("headG"), hatG = $("hatG");
  var flipperG = $("flipperG"), flipperFarG = $("flipperFarG"), tailG = $("tailG");
  var wheelRear = $("wheelRear"), wheelFront = $("wheelFront"), gear = $("gear");
  var crankA = $("crankA"), crankB = $("crankB"), pedalA = $("pedalA"), pedalB = $("pedalB");
  var legFar = $("legFar"), legNear = $("legNear"), footFar = $("footFar"), footNear = $("footNear");
  var scarf = $("scarf"), scarf2 = $("scarf2"), eyelid = $("eyelid"), shadow = $("shadow");
  var stars = $("stars"), snowfall = $("snowfall");

  var BB = { x: 640, y: 610 }, CR = 26;
  var HIP = { near: { x: 620, y: 428 }, far: { x: 592, y: 418 } };
  var LEG = { near: { l1: 95, l2: 120 }, far: { l1: 100, l2: 125 } };

  var speeds = [0.5, 1, 1.6], speedIdx = 1;
  var paused = false, t = 0, last = performance.now();
  var wheelDeg = 0, crankDeg = 0;
  var nextBlink = 2 + Math.random() * 3, blinkLeft = 0;
  var hidden = false;

  var starHTML = "";
  for (var i = 0; i < 70; i++) {
    var sx = (Math.random() * 1280).toFixed(1);
    var sy = (Math.random() * 430).toFixed(1);
    var sr = (0.6 + Math.random() * 1.4).toFixed(2);
    var dur = (2.2 + Math.random() * 3).toFixed(2);
    var del = (Math.random() * 3).toFixed(2);
    starHTML += '<circle class="star" cx="' + sx + '" cy="' + sy + '" r="' + sr + '" style="animation-duration:' + dur + 's;animation-delay:-' + del + 's"/>';
  }
  stars.innerHTML = starHTML;

  var snowHTML = "";
  for (var j = 0; j < 64; j++) {
    var fx = (Math.random() * 1320 - 20).toFixed(1);
    var fr = (1.4 + Math.random() * 2.8).toFixed(2);
    var fdur = (5 + Math.random() * 8).toFixed(2);
    var fdel = (Math.random() * 12).toFixed(2);
    var sdur = (1.6 + Math.random() * 2.4).toFixed(2);
    var sdel = (Math.random() * 2).toFixed(2);
    var fop = (0.45 + Math.random() * 0.5).toFixed(2);
    snowHTML += '<g class="flake" style="animation-duration:' + fdur + 's;animation-delay:-' + fdel + 's">' +
      '<g class="sway" style="animation-duration:' + sdur + 's;animation-delay:-' + sdel + 's">' +
      '<circle cx="' + fx + '" cy="0" r="' + fr + '" fill="var(--flake-c)" opacity="' + fop + '"/></g></g>';
  }
  snowfall.innerHTML = snowHTML;

  function solveIK(hx, hy, fx, fy, l1, l2) {
    var dx = fx - hx, dy = fy - hy;
    var d = Math.sqrt(dx * dx + dy * dy) || 0.001;
    var dmax = l1 + l2 - 0.5, dmin = Math.abs(l1 - l2) + 0.5;
    if (d > dmax) { fx = hx + dx / d * dmax; fy = hy + dy / d * dmax; d = dmax; dx = fx - hx; dy = fy - hy; }
    if (d < dmin) { fx = hx + dx / d * dmin; fy = hy + dy / d * dmin; d = dmin; dx = fx - hx; dy = fy - hy; }
    var a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    var ux = dx / d, uy = dy / d;
    var kx = hx + a * ux, ky = hy + a * uy;
    var c1x = kx - h * uy, c1y = ky + h * ux;
    var c2x = kx + h * uy, c2y = ky - h * ux;
    var knee = (c1x <= c2x) ? { x: c1x, y: c1y } : { x: c2x, y: c2y };
    return { knee: knee, fx: fx, fy: fy };
  }

  function drawLeg(pathEl, hip, foot, leg) {
    var r = solveIK(hip.x, hip.y, foot.x, foot.y, leg.l1, leg.l2);
    pathEl.setAttribute("d", "M " + hip.x.toFixed(1) + " " + hip.y.toFixed(1) +
      " L " + r.knee.x.toFixed(1) + " " + r.knee.y.toFixed(1) +
      " L " + r.fx.toFixed(1) + " " + r.fy.toFixed(1));
  }

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (paused || hidden) { requestAnimationFrame(frame); return; }
    {
      t += dt * speeds[speedIdx];
      wheelDeg += dt * 430 * speeds[speedIdx];
      crankDeg += dt * 185 * speeds[speedIdx];
      nextBlink -= dt;
      if (nextBlink <= 0 && blinkLeft <= 0) { blinkLeft = 0.13; }
      if (blinkLeft > 0) {
        blinkLeft -= dt;
        if (blinkLeft <= 0) { nextBlink = 2.5 + Math.random() * 3.5; }
      }
    }
    eyelid.setAttribute("opacity", blinkLeft > 0 ? 1 : 0);

    var rad = crankDeg * Math.PI / 180;
    var rigBob = 1.8 * Math.sin(t * 4.4);
    var bodyBob = 2.4 * Math.sin(t * 4.4 + 0.9);
    var bodyRot = 2.2 * Math.sin(t * 2.2);

    rig.setAttribute("transform", "translate(0 " + rigBob.toFixed(2) + ")");
    bodyG.setAttribute("transform", "translate(0 " + bodyBob.toFixed(2) + ") rotate(" + bodyRot.toFixed(2) + " 598 378)");
    headG.setAttribute("transform", "rotate(" + (1.8 * Math.sin(t * 2.2 + 0.4)).toFixed(2) + " 680 344)");
    hatG.setAttribute("transform", "translate(0 " + (2.6 * Math.sin(t * 4.4 + 1.6)).toFixed(2) + ") rotate(" + (2 * Math.sin(t * 2.2 + 0.9)).toFixed(2) + " 706 296)");
    flipperG.setAttribute("transform", "rotate(" + (4 * Math.sin(t * 5.6)).toFixed(2) + " 636 372)");
    flipperFarG.setAttribute("transform", "rotate(" + (9 * Math.sin(t * 5.6 + 1)).toFixed(2) + " 596 384)");
    tailG.setAttribute("transform", "rotate(" + (3 + 3 * Math.sin(t * 5.6 + 1)).toFixed(2) + " 530 380)");
    shadow.setAttribute("transform", "translate(655 666) translate(0 " + (rigBob * 0.4).toFixed(2) + ") scale(1 " + (1 - 0.035 * Math.sin(t * 4.4)).toFixed(3) + ") translate(-655 -666)");

    wheelRear.setAttribute("transform", "rotate(" + wheelDeg.toFixed(1) + " 545 585)");
    wheelFront.setAttribute("transform", "rotate(" + wheelDeg.toFixed(1) + " 775 585)");
    gear.setAttribute("transform", "rotate(" + crankDeg.toFixed(1) + " 640 610)");

    var pa = { x: BB.x + CR * Math.cos(rad), y: BB.y + CR * Math.sin(rad) };
    var pb = { x: BB.x - CR * Math.cos(rad), y: BB.y - CR * Math.sin(rad) };
    crankA.setAttribute("x2", pa.x.toFixed(1));
    crankA.setAttribute("y2", pa.y.toFixed(1));
    crankB.setAttribute("x2", pb.x.toFixed(1));
    crankB.setAttribute("y2", pb.y.toFixed(1));
    pedalA.setAttribute("transform", "translate(" + pa.x.toFixed(1) + " " + pa.y.toFixed(1) + ") rotate(" + (-crankDeg).toFixed(1) + ")");
    pedalB.setAttribute("transform", "translate(" + pb.x.toFixed(1) + " " + pb.y.toFixed(1) + ") rotate(" + (-crankDeg).toFixed(1) + ")");

    var footNearPos = { x: pa.x + 4, y: pa.y - 6, rot: -crankDeg + 6 * Math.sin(t * 9) };
    var footFarPos = { x: pb.x + 4, y: pb.y - 6, rot: -crankDeg + 6 * Math.sin(t * 9 + 1.7) };
    drawLeg(legNear, { x: HIP.near.x, y: HIP.near.y + bodyBob }, footNearPos, LEG.near);
    drawLeg(legFar, { x: HIP.far.x, y: HIP.far.y }, footFarPos, LEG.far);
    footNear.setAttribute("transform", "translate(" + footNearPos.x.toFixed(1) + " " + footNearPos.y.toFixed(1) + ") rotate(" + footNearPos.rot.toFixed(1) + ")");
    footFar.setAttribute("transform", "translate(" + footFarPos.x.toFixed(1) + " " + footFarPos.y.toFixed(1) + ") rotate(" + footFarPos.rot.toFixed(1) + ")");

    var d1 = "M 662 356", d2 = "M 664 360";
    for (var k = 1; k <= 7; k++) {
      var wy = 356 + 12 + Math.sin(t * 7 - k * 0.9) * 7 * (k * 0.16) + k * k * 0.5;
      var wy2 = 360 + 16 + Math.sin(t * 7 - k * 0.9 + 0.7) * 8 * (k * 0.16) + k * k * 0.5;
      d1 += " L " + (662 - k * 25) + " " + wy.toFixed(1);
      d2 += " L " + (664 - k * 25) + " " + wy2.toFixed(1);
    }
    scarf.setAttribute("d", d1);
    scarf2.setAttribute("d", d2);

    requestAnimationFrame(frame);
  }

  var btnPause = $("btnPause"), btnSpeed = $("btnSpeed"), btnNight = $("btnNight");

  btnPause.addEventListener("click", function () {
    paused = !paused;
    document.body.classList.toggle("paused", paused);
    btnPause.textContent = paused ? "▶ 播放" : "⏸ 暂停";
  });
  btnSpeed.addEventListener("click", function () {
    speedIdx = (speedIdx + 1) % speeds.length;
    btnSpeed.textContent = "速度 " + speeds[speedIdx].toFixed(1) + "×";
  });
  btnNight.addEventListener("click", function () {
    document.body.classList.toggle("night");
    btnNight.textContent = document.body.classList.contains("night") ? "☀️ 极昼" : "🌙 极夜";
  });
  document.addEventListener("visibilitychange", function () { hidden = document.hidden; });
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space") { e.preventDefault(); btnPause.click(); }
    else if (e.key === "s" || e.key === "S") { btnSpeed.click(); }
    else if (e.key === "n" || e.key === "N") { btnNight.click(); }
  });

  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    paused = true;
    document.body.classList.add("paused");
    btnPause.textContent = "▶ 播放";
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
