<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>鹈鹕骑手 · Pelican Express</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: radial-gradient(1100px 700px at 50% 18%, #2a3a5f 0%, #151b30 65%, #0d1122 100%);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  }
  .stage { 
    position: relative;
    width: min(960px, 94vw, calc((100vh - 40px) * 900 / 520));
    aspect-ratio: 900 / 520;
    border-radius: 26px;
    overflow: hidden;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 30px 70px rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(255, 255, 255, .07);
    animation: pop .6s ease;
  }
  .control-dock {
    position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 12;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 10px 12px 10px 14px; border: 1px solid rgba(255,255,255,.22);
    border-radius: 16px; color: #f5fbff; background: rgba(16, 29, 47, .7);
    box-shadow: 0 10px 24px rgba(4, 12, 24, .22), inset 0 1px 0 rgba(255,255,255,.12);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    cursor: default;
  }
  .control-status { display: flex; align-items: center; gap: 9px; min-width: 118px; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #64e0c0; box-shadow: 0 0 0 4px rgba(100,224,192,.14); }
  .control-status.paused .live-dot { background: #ffd166; box-shadow: 0 0 0 4px rgba(255,209,102,.14); }
  .control-status strong { display: block; font-size: 12px; letter-spacing: .02em; }
  .control-status small { display: block; margin-top: 2px; color: rgba(231,242,247,.65); font-size: 10px; }
  .control-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .control-actions button {
    border: 1px solid rgba(255,255,255,.2); border-radius: 10px; padding: 8px 11px;
    color: #effbff; background: rgba(255,255,255,.1); font: inherit; font-size: 11px;
    font-weight: 700; cursor: pointer; transition: .2s ease;
  }
  .control-actions button:hover, .control-actions button:focus-visible { border-color: rgba(255,255,255,.55); background: rgba(255,255,255,.2); outline: none; }
  .control-actions #toggleBtn { color: #102d3c; border-color: #ffd166; background: #ffd166; }
  .pace-control { display: flex; align-items: center; gap: 7px; padding-left: 7px; color: rgba(231,242,247,.72); font-size: 10px; white-space: nowrap; }
  .pace-control input { width: 84px; accent-color: #ffd166; cursor: pointer; }
  @keyframes pop {
    from { opacity: 0; transform: scale(.96) translateY(10px); }
    to { opacity: 1; transform: none; }
  }
  .sky {
    position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(180deg, #74c4ef 0%, #a5dbf6 42%, #d8f2fc 74%, #eefaff 100%);
  }
  .sun { position: absolute; top: 7%; left: 6%; width: 92px; height: 92px; z-index: 1; }
  .sun-core {
    position: absolute; inset: 24px; border-radius: 50%;
    background: radial-gradient(circle at 36% 34%, #fff3bf, #ffd93d 55%, #ffb92e);
    box-shadow: 0 0 42px 14px rgba(255, 217, 61, .5);
  }
  .sun-rays { position: absolute; inset: 0; width: 100%; height: 100%; animation: spin 30s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .cloud {
    position: absolute; left: 0; z-index: 2;
    animation: drift var(--cd, 56s) linear infinite var(--dl, -8s);
  }
  .cloud svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 8px 10px rgba(70, 130, 180, .18)); }
  @keyframes drift { from { transform: translateX(1180px); } to { transform: translateX(-260px); } }

  .bird {
    position: absolute; left: 0; z-index: 2;
    animation: fly var(--bd, 32s) linear infinite var(--bdl, -10s);
  }
  .bird svg { display: block; animation: flap .55s ease-in-out infinite alternate; transform-origin: 50% 60%; }
  @keyframes fly { from { transform: translateX(1200px); } to { transform: translateX(-240px); } }
  @keyframes flap { from { transform: scaleY(.55); } to { transform: scaleY(1); } }

  .hills-far, .hills-near { position: absolute; left: 0; width: 200%; }
  .hills-far { bottom: 128px; height: 80px; z-index: 2; animation: slide 26s linear infinite; }
  .hills-near { bottom: 128px; height: 80px; z-index: 3; animation: slide 16s linear infinite; }
  .hills-far svg, .hills-near svg { width: 100%; height: 100%; display: block; }
  @keyframes slide { to { transform: translateX(-50%); } }

  .road {
    position: absolute; left: 0; right: 0; bottom: 0; height: 106px; z-index: 4;
    background: linear-gradient(180deg, #4a5064 0%, #333848 16%, #262b38 100%);
    border-top: 3px solid #5a6175;
  }
  .grass {
    position: absolute; left: 0; right: 0; bottom: 106px; height: 22px; z-index: 4;
    background: linear-gradient(180deg, #84cf74 0%, #58a753 100%);
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, .28);
  }
  .bushes {
    position: absolute; left: 0; bottom: 112px; width: 200%; height: 62px; z-index: 5;
    animation: slide 1.05s linear infinite;
  }
  .bushes svg { width: 100%; height: 100%; display: block; }
  .dashes {
    position: absolute; left: 0; right: 0; top: 34px; height: 10px; z-index: 5;
    background: repeating-linear-gradient(90deg, #ffd93d 0 46px, transparent 46px 100px);
    animation: dashMove 1s linear infinite;
  }
  @keyframes dashMove { to { background-position: -100px 0; } }

  .scene { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 6; }

  #eye { transform-box: view-box; transform-origin: 510px 120px; animation: blink 5.2s infinite; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 94%, 95.5% { transform: scaleY(.08); } }

  #pouch { transform-box: view-box; transform-origin: 514px 130px; animation: pouchPulse 1.15s ease-in-out infinite; }
  @keyframes pouchPulse {
    0%, 100% { transform: scaleY(1) rotate(0deg); }
    50% { transform: scaleY(1.1) rotate(-1.5deg); }
  }

  #body { animation: bob .9s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3.5px); } }

  #tailFeathers { transform-box: view-box; transform-origin: 312px 206px; animation: tailWag .75s ease-in-out infinite; }
  @keyframes tailWag { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }

  #nearWing { transform-box: view-box; transform-origin: 432px 176px; animation: wingWiggle 1.1s ease-in-out infinite; }
  @keyframes wingWiggle { 0%, 100% { transform: rotate(-1.6deg); } 50% { transform: rotate(2deg); } }

  #fish { transform-box: view-box; transform-origin: 552px 266px; animation: fishWig .5s ease-in-out infinite; }
  @keyframes fishWig { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg); } }

  #rearLight { animation: lightPulse 1.3s ease-in-out infinite; }
  @keyframes lightPulse { 0%, 100% { opacity: .95; } 50% { opacity: .4; } }

  .speedlines {
    position: absolute; left: 0; right: 0; top: 20%; height: 60%;
    z-index: 7; pointer-events: none; opacity: 0; transition: opacity .25s;
  }
  .speedlines span {
    position: absolute; left: 0; width: 140px; height: 5px; border-radius: 4px;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, .9));
    animation: streak .36s linear infinite;
  }
  @keyframes streak { from { transform: translateX(1180px); } to { transform: translateX(-300px); } }

  .stage::after {
    content: ""; position: absolute; inset: 0; z-index: 8; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 42%, transparent 55%, rgba(10, 20, 40, .22) 100%);
  }

  .hud { position: absolute; top: 16px; left: 0; right: 0; z-index: 9; text-align: center; pointer-events: none; }
  .hud h1 {
    font-size: clamp(20px, 3.6vw, 34px); color: #0b4a52;
    letter-spacing: 3px; font-weight: 800;
    text-shadow: 0 2px 0 rgba(255, 255, 255, .55);
  }
  .hud h1 em {
    font-style: normal; font-size: .48em; font-weight: 600;
    letter-spacing: .42em; color: #0e6a72; opacity: .8; margin-left: 10px;
  }
  .hud p {
    margin-top: 6px; font-size: clamp(11px, 1.7vw, 14px);
    color: #0b4a52; opacity: .82; font-weight: 600;
  }
  .hud p span { opacity: .6; font-weight: 500; }

  .stage.sprint .hills-far { animation-duration: 11s; }
  .stage.sprint .hills-near { animation-duration: 7s; }
  .stage.sprint .bushes { animation-duration: .42s; }
  .stage.sprint .dashes { animation-duration: .4s; }
  .stage.sprint .cloud { animation-duration: calc(var(--cd, 56s) / 2.4); }
  .stage.sprint .bird { animation-duration: calc(var(--bd, 32s) / 2.2); }
  .stage.sprint .speedlines { opacity: .7; }
  .stage.sprint #body { animation-duration: .36s; }
  .stage.paused .hud p { opacity: .55; }

  @media (prefers-reduced-motion: reduce) {
    .stage, .sun-rays, .cloud, .bird, .bird svg, .hills-far, .hills-near, .bushes, .dashes,
    #eye, #pouch, #body, #tailFeathers, #nearWing, #fish, #rearLight, .speedlines span {
      animation: none !important;
    }
  }
  @media (max-width: 640px) {
    body { padding: 10px; }
    .stage { width: min(960px, 100vw - 20px, calc((100vh - 20px) * 900 / 520)); border-radius: 20px; }
    .control-dock { left: 10px; right: 10px; bottom: 10px; flex-wrap: wrap; gap: 8px; padding: 9px 10px; }
    .control-status { min-width: 0; }
    .control-actions { width: 100%; justify-content: space-between; }
    .pace-control { margin-left: auto; }
  }
</style>
</head>

  <div class="speedlines" aria-hidden="true">
    <span style="top: 16%; animation-delay: 0s;"></span>
    <span style="top: 30%; animation-delay: -0.12s;"></span>
    <span style="top: 46%; animation-delay: -0.24s;"></span>
    <span style="top: 62%; animation-delay: -0.06s;"></span>
    <span style="top: 74%; animation-delay: -0.3s;"></span>
  </div>

  <section class="control-dock" aria-label="动画控制">
    <div class="control-status" id="controlStatus">
      <span class="live-dot" aria-hidden="true"></span>
      <div><strong id="controlTitle">悠闲巡航</strong><small id="controlMeta">12 km/h · 海风模式</small></div>
    </div>
    <div class="control-actions">
      <button id="toggleBtn" type="button" aria-pressed="false">暂停</button>
      <button id="resetBtn" type="button">重置</button>
      <label class="pace-control" for="paceInput">节奏 <input id="paceInput" type="range" min="0.6" max="1.8" value="1" step="0.1" /></label>
    </div>
  </section>

  <div class="hud">
    <h1>🚴 鹈鹕快递 <em>PELICAN EXPRESS</em></h1>
    <p id="mode">悠闲骑行中 🚲 <span>· 点击画面加速冲刺 🚀</span></p>
  </div>
</main>

<script>
(function () {
  var stage = document.getElementById('stage');
  var mode = document.getElementById('mode');
  var toggleBtn = document.getElementById('toggleBtn');
  var resetBtn = document.getElementById('resetBtn');
  var paceInput = document.getElementById('paceInput');
  var controlStatus = document.getElementById('controlStatus');
  var controlTitle = document.getElementById('controlTitle');
  var controlMeta = document.getElementById('controlMeta');
  var crankG = document.getElementById('crank');
  var wheelR = document.getElementById('wheelRear');
  var wheelF = document.getElementById('wheelFront');
  var chainTop = document.getElementById('chainTop');
  var chainBot = document.getElementById('chainBot');
  var scarf = document.getElementById('scarf');
  var scarfShade = document.getElementById('scarfShade');

  var legs = [
    { hip: [378, 258], l1: 58, l2: 62, t: document.getElementById('legA-t'), s: document.getElementById('legA-s'), f: document.getElementById('legA-f') },
    { hip: [364, 262], l1: 56, l2: 62, t: document.getElementById('legB-t'), s: document.getElementById('legB-s'), f: document.getElementById('legB-f') }
  ];

  var BB = [390, 360], CR = 22;
  var crankA = 0, sprint = false, paused = false, pace = 1, last = performance.now();
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function ik(hx, hy, fx, fy, l1, l2) {
    var dx = fx - hx, dy = fy - hy;
    var d = Math.max(Math.sqrt(dx * dx + dy * dy), 0.001);
    var dc = Math.min(d, (l1 + l2) * 0.995);
    var a = (l1 * l1 - l2 * l2 + dc * dc) / (2 * dc);
    var h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    var ux = dx / d, uy = dy / d;
    return [hx + a * ux + h * uy, hy + a * uy - h * ux];
  }

  function render() {
    var deg = crankA * 180 / Math.PI;
    crankG.setAttribute('transform', 'rotate(' + deg + ' 390 360)');
    wheelR.setAttribute('transform', 'rotate(' + deg * 3 + ' 250 355)');
    wheelF.setAttribute('transform', 'rotate(' + deg * 3 + ' 530 355)');
    chainTop.setAttribute('stroke-dashoffset', (-crankA * 14).toFixed(1));
    chainBot.setAttribute('stroke-dashoffset', (-crankA * 14).toFixed(1));

    var p1x = BB[0] + CR * Math.cos(crankA);
    var p1y = BB[1] + CR * Math.sin(crankA);
    var p2x = BB[0] + CR * Math.cos(crankA + Math.PI);
    var p2y = BB[1] + CR * Math.sin(crankA + Math.PI);

    legs.forEach(function (leg, i) {
      var px = i === 0 ? p1x : p2x;
      var py = i === 0 ? p1y : p2y;
      var k = ik(leg.hip[0], leg.hip[1], px, py, leg.l1, leg.l2);
      leg.t.setAttribute('x2', k[0].toFixed(1));
      leg.t.setAttribute('y2', k[1].toFixed(1));
      leg.s.setAttribute('x1', k[0].toFixed(1));
      leg.s.setAttribute('y1', k[1].toFixed(1));
      leg.s.setAttribute('x2', px.toFixed(1));
      leg.s.setAttribute('y2', py.toFixed(1));
      leg.f.setAttribute('transform', 'translate(' + px.toFixed(1) + ' ' + py.toFixed(1) + ') rotate(' + deg.toFixed(1) + ')');
    });

    var x = 450, y = 176;
    var pts = [x + ',' + y];
    var ang;
    for (var i = 0; i < 9; i++) {
      ang = 195 + 26 * Math.sin(crankA * 2.2 - i * 0.6) + i * 3;
      var r = ang * Math.PI / 180;
      x += 17 * Math.cos(r);
      y += 17 * Math.sin(r);
      pts.push(x.toFixed(1) + ',' + y.toFixed(1));
    }
    var ex = x, ey = y;
    var fringe = [[ang - 28, 7], [ang + 24, 7], [ang + 62, 6]];
    fringe.forEach(function (f) {
      var fr = f[0] * Math.PI / 180;
      pts.push((ex + f[1] * Math.cos(fr)).toFixed(1) + ',' + (ey + f[1] * Math.sin(fr)).toFixed(1));
    });
    scarf.setAttribute('points', pts.join(' '));
    scarfShade.setAttribute('points', pts.map(function (p) {
      var c = p.split(',');
      return c[0] + ',' + (parseFloat(c[1]) + 3).toFixed(1);
    }).join(' '));
  }

  function tick(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!reduced && !paused) {
      crankA += dt * (sprint ? 16 : 7) * pace;
      render();
    }
    requestAnimationFrame(tick);
  }

  function updateControls() {
    stage.classList.toggle('sprint', sprint);
    stage.classList.toggle('paused', paused);
    controlStatus.classList.toggle('paused', paused);
    toggleBtn.textContent = paused ? '继续' : '暂停';
    toggleBtn.setAttribute('aria-pressed', String(paused));
    controlTitle.textContent = paused ? '已暂停' : (sprint ? '冲刺模式' : '悠闲巡航');
    controlMeta.textContent = paused ? '点击继续保持骑行' : (sprint ? '24 km/h · 迎风加速' : '12 km/h · 海风模式');
    mode.innerHTML = paused
      ? '停在海风里 ⏸ <span>· 点击继续骑行</span>'
      : sprint
        ? '冲刺模式 🚀 <span>· 点击慢下来</span>'
        : '悠闲骑行中 🚲 <span>· 点击画面加速冲刺 🚀</span>';
  }

  function toggleSprint() {
    sprint = !sprint;
    updateControls();
  }

  function togglePaused() { paused = !paused; last = performance.now(); updateControls(); }

  stage.addEventListener('click', function (event) {
    if (!event.target.closest('.control-dock')) toggleSprint();
  });
  toggleBtn.addEventListener('click', togglePaused);
  resetBtn.addEventListener('click', function () { crankA = 0; sprint = false; paused = false; pace = 1; paceInput.value = '1'; render(); updateControls(); });
  paceInput.addEventListener('input', function () { pace = Number(paceInput.value); controlMeta.textContent = paused ? '点击继续保持骑行' : ((sprint ? '24' : '12') * pace).toFixed(0) + ' km/h · ' + (sprint ? '迎风加速' : '海风模式'); });
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space') { e.preventDefault(); togglePaused(); }
  });

  render();
  updateControls();
  requestAnimationFrame(tick);
})();
</script>
