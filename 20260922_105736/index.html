<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金毛快线 · Golden Ride</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1230; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
  }
  .stage { position: fixed; inset: 0; }
  #scene { width: 100%; height: 100%; display: block; }
  #scene stop, #scene rect, #scene path, #scene circle, #scene ellipse, #scene line {
    transition: fill .7s ease, stop-color .7s ease, stroke .7s ease;
  }
  #rig, #bodyG, #headG, #wheelRear, #wheelFront { will-change: transform; }
  .overlay {
    position: fixed; top: 22px; left: 26px; color: var(--text); z-index: 5;
    pointer-events: none; user-select: none;
  }
  .overlay h1 { font-size: 26px; letter-spacing: 1px; font-weight: 800; text-shadow: 0 2px 12px rgba(40,40,20,.2); }
  .overlay p { margin-top: 6px; font-size: 13px; opacity: .75; letter-spacing: .5px; }
  .controls {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 5;
  }
  .controls button {
    border: 1px solid rgba(255,255,255,.4); outline: none; cursor: pointer;
    background: rgba(30, 50, 30, .42); color: #fff; backdrop-filter: blur(8px);
    padding: 8px 16px; border-radius: 999px; font-size: 13px; letter-spacing: .5px;
    transition: transform .15s ease, background .2s ease;
  }
  .controls button:hover { background: rgba(30, 50, 30, .62); transform: translateY(-2px); }
  .hint {
    position: fixed; right: 22px; bottom: 22px; z-index: 5; color: var(--text);
    font-size: 12px; opacity: .55; pointer-events: none; user-select: none; letter-spacing: .5px;
  }
  :root {
    --text: #2d4a1e;
    --sky-1: #8fd4ff; --sky-2: #cfeaff; --sky-3: #fff6dc;
    --sun-core: #fff3c4; --sun-ray: #ffd76a;
    --hill-1: #a8d98a; --hill-2: #82c469; --hill-3: #5da84a;
    --field-1: #9ccb6e; --field-2: #7ab354;
    --road-1: #9aa0a6; --road-2: #7c8288;
    --dash: #fff3d0; --edge: #f4f7f8;
    --fence: #d9b07c; --fence-line: #9c7038;
    --trunk: #8a5a33; --leaf-1: #5da84a; --leaf-2: #48913c; --leaf-3: #3a7a33;
    --fur: #eab04a; --fur-2: #d99430; --fur-light: #f7d9a0; --fur-line: #b57a22;
    --nose: #2b2b2b; --tongue: #f0728c; --tongue-2: #d95c78;
    --bandana: #e2564a; --bandana-2: #b23a30; --tag: #f5c542;
    --petal: #ffc4d6; --petal-2: #ffb0c8;
    --frame: #4a90d9; --frame-dark: #2f6cb0;
    --tire: #33383d; --rim: #dfe6ea; --spoke: #a9b7bf; --hub: #5a6a72;
    --shadow: rgba(20, 40, 20, .25);
    --basket: #c99a58; --basket-line: #9c7033; --bone: #f5efe0; --bone-line: #cbbfa5;
    --star-op: 0; --sun-op: 1; --moon-op: 0;
  }
  body.night {
    --text: #d8e8ff;
    --sky-1: #0a1230; --sky-2: #1a2c52; --sky-3: #37406a;
    --sun-core: #e9edf5; --sun-ray: #b9c6dd;
    --hill-1: #2c4a3a; --hill-2: #223c30; --hill-3: #1a3027;
    --field-1: #27402f; --field-2: #1d3325;
    --road-1: #2f363d; --road-2: #232a30;
    --dash: #ffe9c4; --edge: #c7d3da;
    --fence: #5c4a30; --fence-line: #3c2e1c;
    --trunk: #3d2a1a; --leaf-1: #1f4429; --leaf-2: #193720; --leaf-3: #142b1a;
    --fur: #c9923c; --fur-2: #b57a28; --fur-light: #d9b478; --fur-line: #8a5c18;
    --nose: #141414; --tongue: #c95f78; --tongue-2: #a84a62;
    --bandana: #c9453a; --bandana-2: #992f26; --tag: #d9ad2e;
    --petal: #c98aa4; --petal-2: #b87a96;
    --frame: #3570b0; --frame-dark: #24507f;
    --tire: #1c242c; --rim: #8fa0aa; --spoke: #63737d; --hub: #33454f;
    --shadow: rgba(0, 0, 0, .5);
    --basket: #8f6d3c; --basket-line: #63481f; --bone: #cfc8b5; --bone-line: #9a927e;
    --star-op: 1; --sun-op: 0; --moon-op: 1;
  }
  .dashmove { animation: dashmove .55s linear infinite; }
  @keyframes dashmove { to { transform: translateX(-160px); } }
  .dashmove2 { animation: dashmove2 .38s linear infinite; }
  @keyframes dashmove2 { to { transform: translateX(-90px); } }
  .fencemove { animation: fencemove .45s linear infinite; }
  @keyframes fencemove { to { transform: translateX(-100px); } }
  .rays { animation: spin 60s linear infinite; transform-origin: 190px 130px; transform-box: view-box; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #sunGroup { opacity: var(--sun-op); transition: opacity 1s ease; }
  #moonGroup { opacity: var(--moon-op); transition: opacity 1s ease; }
  .stars { opacity: var(--star-op); transition: opacity 1s ease; }
  .star { fill: #fff; animation: twinkle 3.2s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  .clouda { animation: clouddrift 46s linear infinite; }
  .cloudb { animation: clouddrift 64s linear infinite; animation-delay: -22s; }
  .cloudc { animation: clouddrift 80s linear infinite; animation-delay: -50s; }
  .cloudd { animation: clouddrift 38s linear infinite; animation-delay: -8s; }
  @keyframes clouddrift { from { transform: translateX(1420px); } to { transform: translateX(-420px); } }
  .birda { animation: birdfly 30s linear infinite; }
  .birdb { animation: birdfly 44s linear infinite; animation-delay: -18s; }
  .birdc { animation: birdfly 36s linear infinite; animation-delay: -30s; }
  @keyframes birdfly { from { transform: translateX(1420px); } to { transform: translateX(-300px); } }
  .hilla { animation: hillmove 30s linear infinite; }
  .hillb { animation: hillmove 22s linear infinite; animation-delay: -11s; }
  .hillc { animation: hillmove 17s linear infinite; animation-delay: -6s; }
  @keyframes hillmove { from { transform: translateX(1500px); } to { transform: translateX(-700px); } }
  .windblades { animation: spin 9s linear infinite; transform-origin: 190px 300px; transform-box: view-box; }
  .treemove { animation: treemove 9s linear infinite; }
  .treemove.t2 { animation-duration: 12s; animation-delay: -4s; }
  .treemove.t3 { animation-duration: 15s; animation-delay: -9s; }
  @keyframes treemove { from { transform: translateX(1400px); } to { transform: translateX(-320px); } }
  .petal { animation: petalfall linear infinite; }
  .petalsway { animation: sway ease-in-out infinite alternate; }
  .petalspin { transform-box: fill-box; transform-origin: center; animation: petalspin 2.6s linear infinite; }
  @keyframes petalfall { from { transform: translateY(-50px); } to { transform: translateY(770px); } }
  @keyframes sway { from { transform: translateX(-26px); } to { transform: translateX(26px); } }
  @keyframes petalspin { to { transform: rotate(360deg); } }
  .bfly { animation: flydrift linear infinite; }
  .bflybob { animation: bflybob 1.1s ease-in-out infinite alternate; }
  .bw { transform-box: fill-box; animation: wingflap .16s ease-in-out infinite alternate; }
  .bw.right { animation-delay: -.08s; }
  @keyframes flydrift { from { transform: translateX(1420px); } to { transform: translateX(-300px); } }
  @keyframes bflybob { from { transform: translateY(-8px); } 50% { transform: translateY(0); } to { transform: translateY(8px); } }
  @keyframes wingflap { from { transform: scaleX(1); } to { transform: scaleX(.3); } }
  .firefly { animation: flydrift linear infinite; }
  .ffsway { animation: sway ease-in-out infinite alternate; }
  .ffblink { animation: twinkle 2.4s ease-in-out infinite; }
  .grass { animation: grassmove .5s linear infinite; }
  @keyframes grassmove { to { transform: translateX(-300px); } }
  .speedline { animation: speedline .55s linear infinite; opacity: 0; }
  .speedline.s2 { animation-duration: .7s; animation-delay: -0.2s; }
  .speedline.s3 { animation-duration: .48s; animation-delay: -0.35s; }
  .speedline.s4 { animation-duration: .62s; animation-delay: -0.1s; }
  .speedline.s5 { animation-duration: .52s; animation-delay: -0.42s; }
  @keyframes speedline {
    0% { transform: translateX(0); opacity: 0; }
    12% { opacity: .8; }
    85% { opacity: .5; }
    100% { transform: translateX(-900px); opacity: 0; }
  }
  .signmove { animation: signmove 2.6s linear infinite; }
  @keyframes signmove { from { transform: translateX(1400px); } to { transform: translateX(-260px); } }
  .paused .dashmove, .paused .dashmove2, .paused .fencemove, .paused .grass, .paused .speedline,
  .paused .rays, .paused .clouda, .paused .cloudb, .paused .cloudc, .paused .cloudd,
  .paused .birda, .paused .birdb, .paused .birdc,
  .paused .hilla, .paused .hillb, .paused .hillc,
  .paused .treemove, .paused .windblades, .paused .signmove,
  .paused .petal, .paused .petalsway, .paused .petalspin,
  .paused .bfly, .paused .bflybob, .paused .bw,
  .paused .firefly, .paused .ffsway, .paused .ffblink { animation-play-state: paused; }
</style>
</head>
<body>
<div class="stage">

        .body-s1 { stop-color: var(--fur); }
        .body-s2 { stop-color: var(--fur-2); }

  }

  function solveIK(hx, hy, fx, fy, l1, l2) {
    var dx = fx - hx, dy = fy - hy;
    var d = Math.sqrt(dx * dx + dy * dy) || 0.001;
    var dmax = l1 + l2 - 0.5, dmin = Math.abs(l1 - l2) + 0.5;
    if (d > dmax) { fx = hx + dx / d * dmax; fy = hy + dy / d * dmax; d = dmax; dx = fx - hx; dy = fy - hy; }
    if (d < dmin) { fx = hx + dx / d * dmin; fy = hy + dy / d * dmin; d = dmin; dx = fx - hx; dy = fy - hy; }
    var a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    var ux = dx / d, uy = dy / d;
    var kx = hx + a * ux, ky = hy + a * uy;
    var c1x = kx - h * uy, c1y = ky + h * ux;
    var c2x = kx + h * uy, c2y = ky - h * ux;
    var knee = (c1x <= c2x) ? { x: c1x, y: c1y } : { x: c2x, y: c2y };
    return { knee: knee, fx: fx, fy: fy };
  }

  function drawLeg(pathEl, hip, foot, leg) {

  }

  function frame(now) {

      wheelDeg += dt * 430 * speeds[speedIdx];

      if (nextBlink <= 0 && blinkLeft <= 0) { blinkLeft = 0.13; }

    }
    eyelid.setAttribute("opacity", blinkLeft > 0 ? 1 : 0);

    var rad = crankDeg * Math.PI / 180;
    var rigBob = 1.8 * Math.sin(t * 4.4);
    var bodyBob = 2.4 * Math.sin(t * 4.4 + 0.9);
    var bodyRot = 2.2 * Math.sin(t * 2.2);

    rig.setAttribute("transform", "translate(0 " + rigBob.toFixed(2) + ")");
    bodyG.setAttribute("transform", "translate(0 " + bodyBob.toFixed(2) + ") rotate(" + bodyRot.toFixed(2) + " 600 356)");
    headG.setAttribute("transform", "rotate(" + (2 * Math.sin(t * 2.2 + 0.4)).toFixed(2) + " 696 292)");
    tailG.setAttribute("transform", "rotate(" + (17 * Math.sin(t * 9)).toFixed(2) + " 516 344)");
    tailTip.setAttribute("transform", "rotate(" + (9 * Math.sin(t * 9 + 0.6)).toFixed(2) + " -70 -36)");
    earG.setAttribute("transform", "rotate(" + (11 * Math.sin(t * 7.5)).toFixed(2) + " 728 212)");
    earFarG.setAttribute("transform", "rotate(" + (9 * Math.sin(t * 7.5 + 1.2)).toFixed(2) + " 700 214)");
    armG.setAttribute("transform", "rotate(" + (3 * Math.sin(t * 5.6)).toFixed(2) + " 664 352)");
    armFarG.setAttribute("transform", "rotate(" + (3 * Math.sin(t * 5.6 + 1)).toFixed(2) + " 652 344)");
    tongueG.setAttribute("transform", "rotate(" + (13 * Math.sin(t * 5.2)).toFixed(2) + " 758 270) scale(1 " + (1 + 0.12 * Math.sin(t * 5.2 + 0.5)).toFixed(3) + ")");
    shadow.setAttribute("transform", "translate(655 658) translate(0 " + (rigBob * 0.4).toFixed(2) + ") scale(1 " + (1 - 0.035 * Math.sin(t * 4.4)).toFixed(3) + ") translate(-655 -658)");

    wheelRear.setAttribute("transform", "rotate(" + wheelDeg.toFixed(1) + " 545 575)");
    wheelFront.setAttribute("transform", "rotate(" + wheelDeg.toFixed(1) + " 775 575)");
    gear.setAttribute("transform", "rotate(" + crankDeg.toFixed(1) + " 640 600)");

    var pa = { x: BB.x + CR * Math.cos(rad), y: BB.y + CR * Math.sin(rad) };
    var pb = { x: BB.x - CR * Math.cos(rad), y: BB.y - CR * Math.sin(rad) };
    crankA.setAttribute("x2", pa.x.toFixed(1));
    crankA.setAttribute("y2", pa.y.toFixed(1));
    crankB.setAttribute("x2", pb.x.toFixed(1));
    crankB.setAttribute("y2", pb.y.toFixed(1));
    pedalA.setAttribute("transform", "translate(" + pa.x.toFixed(1) + " " + pa.y.toFixed(1) + ") rotate(" + (-crankDeg).toFixed(1) + ")");
    pedalB.setAttribute("transform", "translate(" + pb.x.toFixed(1) + " " + pb.y.toFixed(1) + ") rotate(" + (-crankDeg).toFixed(1) + ")");

    var footNearPos = { x: pa.x + 4, y: pa.y - 6, rot: -crankDeg + 6 * Math.sin(t * 9) };
    var footFarPos = { x: pb.x + 4, y: pb.y - 6, rot: -crankDeg + 6 * Math.sin(t * 9 + 1.7) };
    drawLeg(legNear, { x: HIP.near.x, y: HIP.near.y + bodyBob }, footNearPos, LEG.near);
    drawLeg(legFar, { x: HIP.far.x, y: HIP.far.y }, footFarPos, LEG.far);
    footNear.setAttribute("transform", "translate(" + footNearPos.x.toFixed(1) + " " + footNearPos.y.toFixed(1) + ") rotate(" + footNearPos.rot.toFixed(1) + ")");
    footFar.setAttribute("transform", "translate(" + footFarPos.x.toFixed(1) + " " + footFarPos.y.toFixed(1) + ") rotate(" + footFarPos.rot.toFixed(1) + ")");

    var d1 = "M 684 310";
    for (var k = 1; k <= 5; k++) {
      var wy = 310 + 10 + Math.sin(t * 8 - k * 0.9) * 6 * (k * 0.18) + k * k * 0.6;
      d1 += " L " + (684 - k * 22) + " " + wy.toFixed(1);
    }
    bandanaTail.setAttribute("d", d1);

    requestAnimationFrame(frame);
  }

  var btnPause = $("btnPause"), btnSpeed = $("btnSpeed"), btnNight = $("btnNight");

  btnPause.addEventListener("click", function () {
    paused = !paused;
    document.body.classList.toggle("paused", paused);
    btnPause.textContent = paused ? "▶ 播放" : "⏸ 暂停";
  });
  btnSpeed.addEventListener("click", function () {
    speedIdx = (speedIdx + 1) % speeds.length;
    btnSpeed.textContent = "速度 " + speeds[speedIdx].toFixed(1) + "×";
  });
  btnNight.addEventListener("click", function () {
    document.body.classList.toggle("night");
    btnNight.textContent = document.body.classList.contains("night") ? "☀️ 白昼" : "🌙 星夜";
  });
  document.addEventListener("visibilitychange", function () { hidden = document.hidden; });
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space") { e.preventDefault(); btnPause.click(); }
    else if (e.key === "s" || e.key === "S") { btnSpeed.click(); }
    else if (e.key === "n" || e.key === "N") { btnNight.click(); }
  });

  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    paused = true;
    document.body.classList.add("paused");
    btnPause.textContent = "▶ 播放";
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
