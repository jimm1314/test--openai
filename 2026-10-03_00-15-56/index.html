<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚴 鹈鹕骑自行车</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b2545;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
  svg{display:block;width:100vw;height:100vh;}
  svg text{font-family:inherit;}

  /* 昼夜切换 */
  #skyGrad .top{stop-color:#6ec6f5;transition:stop-color .8s;}
  #skyGrad .bot{stop-color:#eaf7ff;transition:stop-color .8s;}
  svg.night #skyGrad .top{stop-color:#0b2545;}
  svg.night #skyGrad .bot{stop-color:#1e3a5f;}
  .cloud{fill:#ffffff;opacity:.92;transition:fill .8s,opacity .8s;}
  svg.night .cloud{fill:#8fa5c4;opacity:.75;}
  #sunBody{fill:#ffd94d;transition:fill .8s;}
  svg.night #sunBody{fill:#eef3f9;}
  #sunRays{transition:opacity .8s;}
  svg.night #sunRays{opacity:0;}
  #stars{opacity:0;transition:opacity 1.2s;}
  svg.night #stars{opacity:1;}
  .tw{animation:twinkle 2.2s infinite alternate;}
  @keyframes twinkle{from{opacity:.3}to{opacity:1}}
  #nightDim{opacity:0;transition:opacity .8s;}
  svg.night #nightDim{opacity:.4;}
  #beamG{opacity:0;transition:opacity .6s;}
  svg.night #beamG{opacity:1;}
  svg.night #tailLight{animation:blink 1.1s infinite;}
  @keyframes blink{0%,100%{opacity:.15}50%{opacity:1}}

  /* 铃铛 */
  #bell{transform-box:fill-box;transform-origin:center;}
  #bell.ring{animation:bellP .45s ease;}
  @keyframes bellP{0%{transform:scale(1)}30%{transform:scale(1.5) rotate(10deg)}
    60%{transform:scale(.9)}100%{transform:scale(1)}}

  /* 对话气泡 */
  #bubble{opacity:0;transition:opacity .22s;pointer-events:none;}
  #bubbleInner{transform-box:fill-box;transform-origin:center;transform:scale(.4);
    transition:transform .25s cubic-bezier(.34,1.56,.64,1);}
  #bubble.show{opacity:1;}
  #bubble.show #bubbleInner{transform:scale(1);}
  #pelicanHit{cursor:pointer;}

  /* HTML 覆盖层 */
  #title{position:fixed;top:16px;left:18px;color:#fff;font-size:17px;font-weight:600;
    text-shadow:0 1px 6px rgba(0,0,0,.35);opacity:.9;user-select:none;}
  #ui{position:fixed;left:18px;bottom:18px;display:flex;gap:10px;align-items:center;
    background:rgba(15,22,34,.55);backdrop-filter:blur(6px);padding:10px 14px;
    border-radius:40px;user-select:none;z-index:10;}
  #ui button{width:44px;height:44px;border-radius:50%;border:none;
    background:rgba(255,255,255,.14);color:#fff;font-size:20px;cursor:pointer;
    transition:background .2s,transform .15s;}
  #ui button:hover{background:rgba(255,255,255,.3);transform:translateY(-2px);}
  #ui button:active{transform:translateY(0) scale(.94);}
  #speedLabel{color:#fff;font-size:14px;min-width:56px;text-align:center;}
  #hint{position:fixed;right:18px;bottom:18px;color:rgba(255,255,255,.75);font-size:12px;
    text-shadow:0 1px 4px rgba(0,0,0,.4);user-select:none;z-index:10;}
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop class="top" offset="0"/>
      <stop class="bot" offset="1"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a4d97f"/>
      <stop offset="1" stop-color="#79bd57"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a7280"/>
      <stop offset="1" stop-color="#4d545e"/>
    </linearGradient>
    <radialGradient id="glowGrad">
      <stop offset="0" stop-color="#ffe89a" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffe89a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe08a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffe08a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 天空 / 太阳 / 云 -->
  <rect x="-20" y="-20" width="1040" height="640" fill="url(#skyGrad)"/>
  <g id="stars"></g>
  <g id="sunG">
    <circle cx="858" cy="92" r="74" fill="url(#glowGrad)"/>
    <g id="sunRays"></g>
    <circle id="sunBody" cx="858" cy="92" r="34" fill="#ffd94d" stroke="#f2b53c" stroke-width="3"/>
  </g>
  <g id="clouds"></g>

  <!-- 远山（视差滚动） -->
  <g id="hillsFarG">
    <path fill="#b9e29a" d="M0 470 Q150 392 300 470 T600 470 T900 470 T1200 470 V530 H0 Z"/>
    <path fill="#b9e29a" d="M0 470 Q150 392 300 470 T600 470 T900 470 T1200 470 V530 H0 Z" transform="translate(1200,0)"/>
  </g>
  <g id="hillsNearG">
    <path fill="#8bc96a" d="M0 486 Q100 448 200 486 T400 486 T600 486 T800 486 T1000 486 T1200 486 V530 H0 Z"/>
    <path fill="#8bc96a" d="M0 486 Q100 448 200 486 T400 486 T600 486 T800 486 T1000 486 T1200 486 V530 H0 Z" transform="translate(1200,0)"/>
  </g>

  <!-- 草地 / 植被 / 道路 -->
  <rect x="-20" y="486" width="1040" height="72" fill="url(#grassGrad)"/>
  <g id="bushes"></g>
  <g id="roadG">
    <rect x="-20" y="556" width="1040" height="46" fill="url(#roadGrad)"/>
    <line x1="-20" y1="557" x2="1020" y2="557" stroke="#9aa3ae" stroke-width="3"/>
    <line id="roadDash" x1="0" y1="579" x2="1000" y2="579" stroke="#f0f2f4" stroke-width="7" stroke-dasharray="55 65"/>
    <ellipse cx="480" cy="564" rx="235" ry="9" fill="#000" opacity=".15"/>
  </g>

  <!-- 夜幕（位于自行车图层之下，夜晚时小车依然醒目） -->
  <rect id="nightDim" x="-20" y="-20" width="1040" height="640" fill="#0a1a3f" pointer-events="none"/>

  <!-- 自行车 + 鹈鹕 -->
  <g id="bikeG">
    <g id="farLegG">
      <polyline id="farLeg" fill="none" stroke="#c96e1f" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round" points="384,336 430,420 470,510"/>
      <path id="farFoot" d="M-4 0 Q2 -7 6 0 Q10 -7 14 0 Q18 -7 22 0 L20 6 L0 6 Z" fill="#c96e1f"/>
    </g>
    <g id="farCrankG">
      <line id="farCrank" x1="452" y1="480" x2="400" y2="520" stroke="#1f2226" stroke-width="7" stroke-linecap="round"/>
      <rect id="farPedal" x="-12" y="-4" width="24" height="8" rx="2" fill="#4b5563" stroke="#343b43" stroke-width="1"/>
    </g>
    <g id="wheelRearG"></g>
    <g id="wheelFrontG"></g>
    <g id="frameG" fill="none" stroke="#e63946" stroke-width="9" stroke-linecap="round">
      <line x1="452" y1="480" x2="300" y2="470"/>
      <line x1="452" y1="480" x2="390" y2="356"/>
      <line x1="300" y1="470" x2="392" y2="358"/>
      <line x1="452" y1="480" x2="612" y2="380"/>
      <line x1="392" y1="358" x2="600" y2="358"/>
      <line x1="600" y1="358" x2="612" y2="380"/>
      <line x1="612" y1="380" x2="665" y2="470"/>
      <line x1="600" y1="358" x2="597" y2="326"/>
    </g>
    <path d="M571 331 Q598 312 627 331" fill="none" stroke="#e63946" stroke-width="9" stroke-linecap="round"/>
    <circle cx="571" cy="331" r="7" fill="#2b2f36"/>
    <circle cx="627" cy="331" r="7" fill="#2b2f36"/>
    <circle id="bell" cx="598" cy="318" r="5.5" fill="#ffd94d" stroke="#cf8427" stroke-width="1.5"/>
    <circle id="tailLight" cx="306" cy="474" r="5" fill="#ff5252" stroke="#8e2b2b" stroke-width="1.5"/>
    <g id="chainG">
      <circle cx="452" cy="480" r="26" fill="none" stroke="#3a3f44" stroke-width="5"/>
      <circle cx="300" cy="470" r="11" fill="none" stroke="#3a3f44" stroke-width="4"/>
      <line id="chainTop" x1="300" y1="459" x2="452" y2="454" stroke="#3a3f44" stroke-width="3.5" stroke-dasharray="5 3"/>
      <line id="chainBot" x1="300" y1="481" x2="452" y2="506" stroke="#3a3f44" stroke-width="3.5" stroke-dasharray="5 3"/>
    </g>
    <path d="M366 352 Q388 340 412 350 L404 359 Q388 363 371 359 Z" fill="#3a3f44"/>

    <!-- 鹈鹕身体（含上下起伏） -->
    <g id="bodyBobG">
      <path d="M345 285 L321 268 L344 265 L330 250 L353 258 L346 245 L363 261 Z"
        fill="#e8e2d2" stroke="#d9cfb8" stroke-width="1.5" stroke-linejoin="round"/>
      <ellipse cx="393" cy="308" rx="58" ry="44" fill="#f9f6ee" stroke="#e0d8c4" stroke-width="2" transform="rotate(-8 393 308)"/>
      <ellipse cx="378" cy="302" rx="34" ry="21" fill="#efe9dc" stroke="#e0d8c4" stroke-width="1.5" transform="rotate(-14 378 302)"/>
      <path d="M424 296 C458 284 452 250 462 224 C468 210 468 198 465 190" fill="none" stroke="#e0d8c4" stroke-width="27" stroke-linecap="round"/>
      <path d="M424 296 C458 284 452 250 462 224 C468 210 468 198 465 190" fill="none" stroke="#f9f6ee" stroke-width="22" stroke-linecap="round"/>
      <polyline id="scarfTrail" fill="none" stroke="#d64550" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round" points="446,256 430,252 414,250 398,248 382,246 366,244"/>
      <circle cx="450" cy="254" r="8" fill="#d64550"/>
      <!-- 头部（额外轻微点头） -->
      <g id="headBobG">
        <circle cx="464" cy="178" r="21" fill="#f9f6ee" stroke="#e0d8c4" stroke-width="2"/>
        <g id="fishG">
          <path d="M0 0 L11 -11 L16 0 L11 11 Z" fill="#4ea8de" stroke="#2f7ab0" stroke-width="2" stroke-linejoin="round"/>
        </g>
        <path d="M446 180 Q490 238 550 212 Q566 203 566 193 Q505 190 446 180 Z"
          fill="#f7c08a" stroke="#cf8427" stroke-width="2" stroke-linejoin="round"/>
        <path d="M442 164 Q505 162 566 193 Q505 186 446 180 Z"
          fill="#f5a83d" stroke="#cf8427" stroke-width="2" stroke-linejoin="round"/>
        <line x1="472" y1="177" x2="488" y2="180" stroke="#cf8427" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="456" cy="168" r="4" fill="#2b2b2b"/>
        <circle cx="457.5" cy="166.5" r="1.4" fill="#fff"/>
      </g>
      <!-- 翅膀搭在车把上 -->
      <path d="M414 260 C470 246 560 280 612 320 C620 327 616 338 606 334 C552 310 482 288 432 292 C414 288 406 266 414 260 Z"
        fill="#efe9dc" stroke="#d9cfb8" stroke-width="2"/>
      <g stroke="#d9cfb8" stroke-width="2" stroke-linecap="round" fill="none">
        <line x1="556" y1="306" x2="570" y2="316"/>
        <line x1="570" y1="312" x2="584" y2="321"/>
        <line x1="585" y1="318" x2="598" y2="326"/>
      </g>
      <g id="pelicanHit">
        <title>点我按铃铛 🛎️</title>
        <ellipse cx="430" cy="250" rx="130" ry="115" fill="none" pointer-events="all"/>
      </g>
    </g>

    <g id="nearCrankG">
      <line id="nearCrank" x1="452" y1="480" x2="500" y2="445" stroke="#23272b" stroke-width="8" stroke-linecap="round"/>
      <rect id="nearPedal" x="-13" y="-4.5" width="26" height="9" rx="2" fill="#6b7280" stroke="#3a3f44" stroke-width="1.5"/>
    </g>
    <g id="nearLegG">
      <polyline id="nearLeg" fill="none" stroke="#f08c2e" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round" points="396,338 470,420 500,445"/>
      <path id="nearFoot" d="M-4 0 Q2 -7 6 0 Q10 -7 14 0 Q18 -7 22 0 L20 6 L0 6 Z" fill="#f08c2e"/>
    </g>
  </g>

  <!-- 夜间车灯 -->
  <g id="beamG">
    <polygon points="676,458 1000,505 1000,588" fill="url(#beamGrad)"/>
    <circle cx="676" cy="458" r="18" fill="#ffe08a" opacity=".5"/>
    <circle cx="676" cy="458" r="7" fill="#ffd94d" stroke="#b98a1e" stroke-width="2"/>
  </g>

  <!-- 对话气泡 -->
  <g id="bubble">
    <g id="bubbleInner">
      <polygon points="500,110 524,110 480,156" fill="#fff" stroke="#d64550" stroke-width="3" stroke-linejoin="round"/>
      <rect x="448" y="58" width="158" height="54" rx="16" fill="#fff" stroke="#d64550" stroke-width="3"/>
      <text id="bubbleText" x="527" y="93" text-anchor="middle" font-size="26" font-weight="bold" fill="#d64550">叮铃铃！</text>
    </g>
  </g>
</svg>

<div id="title">🚴 鹈鹕骑行之旅</div>
<div id="ui">
  <button id="btnSlow" title="减速">−</button>
  <div id="speedLabel">×1</div>
  <button id="btnFast" title="加速">+</button>
  <button id="btnBell" title="按铃铛（空格）">🔔</button>
  <button id="btnNight" title="切换昼夜（N）">🌙</button>
</div>
<div id="hint">↑/↓ 调速 · 空格 按铃 · N 昼夜 · 点鹈鹕也可以按铃</div>

<script src="pelican.js"></script>
</body>
</html>
