<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>鹈鹕骑自行车</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 32px 16px;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #dff3ff 0%, #f4fbff 100%);
  }
  h1 {
    font-size: clamp(24px, 4vw, 40px);
    font-weight: 800;
    color: #1f6f78;
    letter-spacing: 3px;
    animation: floaty 3s ease-in-out infinite;
  }
  .card {
    width: min(960px, 94vw);
    background: #ffffff;
    border-radius: 24px;
    box-shadow: 0 24px 60px rgba(31, 111, 120, .18);
    padding: 14px;
  }
  svg { display: block; width: 100%; height: auto; border-radius: 16px; }
  .caption { color: #5b8a90; font-size: 14px; letter-spacing: 1px; }
  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }
</style>
</head>
<body>

<h1>🚲 鹈鹕骑自行车</h1>

<div class="card">
<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕努力地骑着自行车">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fdcff"/>
      <stop offset="1" stop-color="#eafaff"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect width="900" height="500" fill="url(#sky)"/>

  <!-- 太阳 -->
  <g>
    <g stroke="#ffd93d" stroke-width="5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 130 92" to="360 130 92" dur="30s" repeatCount="indefinite"/>
      <line x1="172" y1="92" x2="186" y2="92"/>
      <line x1="159.7" y1="62.3" x2="169.6" y2="52.4"/>
      <line x1="130" y1="50" x2="130" y2="36"/>
      <line x1="100.3" y1="62.3" x2="90.4" y2="52.4"/>
      <line x1="88" y1="92" x2="74" y2="92"/>
      <line x1="100.3" y1="121.7" x2="90.4" y2="131.6"/>
      <line x1="130" y1="134" x2="130" y2="148"/>
      <line x1="159.7" y1="121.7" x2="169.6" y2="131.6"/>
    </g>
    <circle cx="130" cy="92" r="34" fill="#ffd93d"/>
    <circle cx="121" cy="83" r="12" fill="#ffe98a" opacity="0.8"/>
  </g>

  <!-- 云朵（右进左出，循环） -->
  <g opacity="0.95">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1250 0" dur="26s" begin="-8s" repeatCount="indefinite"/>
    <g transform="translate(955 60) scale(1.15)" fill="#ffffff">
      <circle cx="0" cy="10" r="20"/><circle cx="26" cy="0" r="26"/><circle cx="54" cy="12" r="18"/>
      <ellipse cx="27" cy="18" rx="46" ry="13"/>
    </g>
  </g>
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1250 0" dur="34s" begin="-22s" repeatCount="indefinite"/>
    <g transform="translate(960 108) scale(0.8)" fill="#ffffff">
      <circle cx="0" cy="10" r="20"/><circle cx="26" cy="0" r="26"/><circle cx="54" cy="12" r="18"/>
      <ellipse cx="27" cy="18" rx="46" ry="13"/>
    </g>
  </g>
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1250 0" dur="42s" begin="-31s" repeatCount="indefinite"/>
    <g transform="translate(965 40) scale(0.95)" fill="#ffffff">
      <circle cx="0" cy="10" r="20"/><circle cx="26" cy="0" r="26"/><circle cx="54" cy="12" r="18"/>
      <ellipse cx="27" cy="18" rx="46" ry="13"/>
    </g>
  </g>

  <!-- 远处飞鸟 -->
  <g stroke="#8aa0b4" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="38s" begin="-14s" repeatCount="indefinite"/>
    <path d="M980 150 q7 -9 14 0 q7 -9 14 0"/>
    <path d="M1030 176 q6 -8 12 0 q6 -8 12 0"/>
  </g>

  <!-- 远山 -->
  <ellipse cx="210" cy="432" rx="270" ry="75" fill="#b9e5c4"/>
  <ellipse cx="700" cy="445" rx="310" ry="85" fill="#a9dec0"/>

  <!-- 草地 -->
  <rect x="0" y="412" width="900" height="88" fill="#93d495"/>

  <!-- 掠过的树和仙人掌 -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1150 0" dur="9s" begin="-2s" repeatCount="indefinite"/>
    <rect x="961" y="372" width="9" height="42" rx="2" fill="#8b6f4e"/>
    <circle cx="958" cy="360" r="16" fill="#58b368"/>
    <circle cx="972" cy="354" r="19" fill="#58b368"/>
    <circle cx="966" cy="340" r="15" fill="#66c273"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1150 0" dur="12s" begin="-6.5s" repeatCount="indefinite"/>
    <rect x="962" y="378" width="7" height="36" rx="2" fill="#8b6f4e"/>
    <circle cx="966" cy="362" r="22" fill="#4ea95f"/>
  </g>
  <g fill="#3f9d5d">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1150 0" dur="10.5s" begin="-8.5s" repeatCount="indefinite"/>
    <rect x="960" y="354" width="13" height="60" rx="6.5"/>
    <rect x="949" y="368" width="12" height="8" rx="4"/>
    <rect x="949" y="356" width="8" height="20" rx="4"/>
    <rect x="973" y="376" width="12" height="8" rx="4"/>
    <rect x="976" y="364" width="8" height="20" rx="4"/>
  </g>

  <!-- 小路 -->
  <rect x="0" y="430" width="900" height="44" fill="#dfc39a"/>
  <rect x="0" y="430" width="900" height="5" fill="#d0b285"/>

  <!-- 路面虚线（飞速后退） -->
  <g fill="#c8a26b">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-90 0" dur="0.45s" repeatCount="indefinite"/>
    <rect x="-60" y="448" width="36" height="7" rx="3.5"/>
    <rect x="30"  y="448" width="36" height="7" rx="3.5"/>
    <rect x="120" y="448" width="36" height="7" rx="3.5"/>
    <rect x="210" y="448" width="36" height="7" rx="3.5"/>
    <rect x="300" y="448" width="36" height="7" rx="3.5"/>
    <rect x="390" y="448" width="36" height="7" rx="3.5"/>
    <rect x="480" y="448" width="36" height="7" rx="3.5"/>
    <rect x="570" y="448" width="36" height="7" rx="3.5"/>
    <rect x="660" y="448" width="36" height="7" rx="3.5"/>
    <rect x="750" y="448" width="36" height="7" rx="3.5"/>
    <rect x="840" y="448" width="36" height="7" rx="3.5"/>
    <rect x="930" y="448" width="36" height="7" rx="3.5"/>
  </g>

  <!-- 车的影子 -->
  <ellipse cx="452" cy="441" rx="150" ry="9" fill="#7a5c33" opacity="0.18"/>

  <!-- ===== 自行车 ===== -->
  <!-- 后轮 -->
  <g>
    <circle cx="330" cy="380" r="55" fill="none" stroke="#3d4451" stroke-width="9"/>
    <circle cx="330" cy="380" r="43" fill="none" stroke="#c8d0da" stroke-width="4"/>
    <g stroke="#9aa5b1" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0 330 380" to="360 330 380" dur="1s" repeatCount="indefinite"/>
      <line x1="330" y1="380" x2="330"   y2="336"/>
      <line x1="330" y1="380" x2="368.1" y2="358"/>
      <line x1="330" y1="380" x2="368.1" y2="402"/>
      <line x1="330" y1="380" x2="330"   y2="424"/>
      <line x1="330" y1="380" x2="291.9" y2="402"/>
      <line x1="330" y1="380" x2="291.9" y2="358"/>
    </g>
    <circle cx="330" cy="380" r="6" fill="#7a8592"/>
  </g>
  <!-- 前轮 -->
  <g>
    <circle cx="570" cy="380" r="55" fill="none" stroke="#3d4451" stroke-width="9"/>
    <circle cx="570" cy="380" r="43" fill="none" stroke="#c8d0da" stroke-width="4"/>
    <g stroke="#9aa5b1" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0 570 380" to="360 570 380" dur="1s" repeatCount="indefinite"/>
      <line x1="570" y1="380" x2="570"   y2="336"/>
      <line x1="570" y1="380" x2="608.1" y2="358"/>
      <line x1="570" y1="380" x2="608.1" y2="402"/>
      <line x1="570" y1="380" x2="570"   y2="424"/>
      <line x1="570" y1="380" x2="531.9" y2="402"/>
      <line x1="570" y1="380" x2="531.9" y2="358"/>
    </g>
    <circle cx="570" cy="380" r="6" fill="#7a8592"/>
  </g>

  <!-- 车架 -->
  <g stroke="#2ec4b6" stroke-width="9" stroke-linecap="round">
    <line x1="445" y1="382" x2="393" y2="280"/>
    <line x1="393" y1="280" x2="548" y2="268"/>
    <line x1="445" y1="382" x2="556" y2="292"/>
    <line x1="556" y1="292" x2="570" y2="380"/>
    <line x1="445" y1="382" x2="330" y2="380"/>
    <line x1="393" y1="280" x2="330" y2="380"/>
  </g>
  <line x1="548" y1="268" x2="556" y2="292" stroke="#27aca0" stroke-width="11" stroke-linecap="round"/>

  <!-- 链条与牙盘 -->
  <line x1="442" y1="368" x2="330" y2="374" stroke="#8f9aa6" stroke-width="3"/>
  <line x1="442" y1="396" x2="330" y2="386" stroke="#8f9aa6" stroke-width="3"/>
  <circle cx="330" cy="380" r="9" fill="none" stroke="#7a8592" stroke-width="3"/>
  <circle cx="445" cy="382" r="15" fill="#eef2f5" stroke="#7a8592" stroke-width="4"/>
  <circle cx="445" cy="382" r="4" fill="#7a8592"/>

  <!-- 座管、车座、车把 -->
  <line x1="393" y1="280" x2="388" y2="262" stroke="#8f9aa6" stroke-width="7" stroke-linecap="round"/>
  <rect x="362" y="252" width="48" height="13" rx="6.5" fill="#6b4f3f"/>
  <path d="M548 268 L542 242 L566 236" fill="none" stroke="#8f9aa6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="566" cy="236" r="6" fill="#6b4f3f"/>

  <!-- 前筐和里面的鱼 -->
  <g>
    <path d="M530 296 L588 296 L580 338 L538 338 Z" fill="#c98f5f" stroke="#a9703d" stroke-width="3" stroke-linejoin="round"/>
    <line x1="534" y1="310" x2="584" y2="310" stroke="#a9703d" stroke-width="2" opacity="0.7"/>
    <line x1="536" y1="324" x2="582" y2="324" stroke="#a9703d" stroke-width="2" opacity="0.7"/>
    <line x1="546" y1="296" x2="548" y2="338" stroke="#a9703d" stroke-width="2" opacity="0.5"/>
    <line x1="562" y1="296" x2="562" y2="338" stroke="#a9703d" stroke-width="2" opacity="0.5"/>
    <line x1="576" y1="296" x2="574" y2="338" stroke="#a9703d" stroke-width="2" opacity="0.5"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="8 560 292; -8 560 292; 8 560 292" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" dur="0.8s" repeatCount="indefinite"/>
      <path d="M572 288 L584 280 L584 296 Z" fill="#4aa8de"/>
      <ellipse cx="558" cy="288" rx="15" ry="8" fill="#6ec6ff"/>
      <circle cx="551" cy="286" r="1.8" fill="#1d3557"/>
    </g>
  </g>

  <!-- 曲柄、脚踏和脚丫（整体绕牙盘旋转） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 445 382" to="360 445 382" dur="1s" repeatCount="indefinite"/>
    <line x1="445" y1="382" x2="445" y2="410" stroke="#5a6472" stroke-width="6" stroke-linecap="round"/>
    <line x1="445" y1="382" x2="445" y2="354" stroke="#5a6472" stroke-width="6" stroke-linecap="round"/>
    <rect x="433" y="410" width="24" height="8" rx="4" fill="#3d4451"/>
    <rect x="433" y="346" width="24" height="8" rx="4" fill="#3d4451"/>
    <circle cx="445" cy="414" r="7.5" fill="#f4a259"/>
    <circle cx="445" cy="350" r="7.5" fill="#e08e45"/>
  </g>

  <!-- 鹈鹕的腿（远端 + 近端，跟随脚踏画圆） -->
  <path fill="none" stroke="#e08e45" stroke-width="10" stroke-linecap="round" d="M425 320 L445 350">
    <animate attributeName="d" dur="1s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
      values="M425 320 L445 350; M425 320 L467.6 359.4; M425 320 L477 382; M425 320 L467.6 404.6; M425 320 L445 414; M425 320 L422.4 404.6; M425 320 L413 382; M425 320 L422.4 359.4; M425 320 L445 350"/>
  </path>
  <path fill="none" stroke="#f4a259" stroke-width="11" stroke-linecap="round" d="M418 324 L445 414">
    <animate attributeName="d" dur="1s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
      values="M418 324 L445 414; M418 324 L422.4 404.6; M418 324 L413 382; M418 324 L422.4 359.4; M418 324 L445 350; M418 324 L467.6 359.4; M418 324 L477 382; M418 324 L467.6 404.6; M418 324 L445 414"/>
  </path>

  <!-- ===== 鹈鹕身体（整体上下颠簸） ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" dur="0.5s" repeatCount="indefinite"/>

    <!-- 尾巴（轻微摇摆） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 338 300; 6 338 300; -4 338 300" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" dur="0.5s" repeatCount="indefinite"/>
      <path d="M338 292 L298 312 L342 322 Z" fill="#ffffff" stroke="#d3dde4" stroke-width="2" stroke-linejoin="round"/>
    </g>

    <!-- 胖肚子 -->
    <ellipse cx="408" cy="262" rx="88" ry="80" fill="#ffffff" stroke="#d3dde4" stroke-width="2.5"/>
    <path d="M340 300 C370 336 446 336 476 300" fill="none" stroke="#e6edf2" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

    <!-- 围巾飘带（系在脖子上向后飞） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="6 474 202; -8 474 202; 6 474 202" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" dur="0.7s" repeatCount="indefinite"/>
      <path d="M474 202 C438 206 390 190 332 214" fill="none" stroke="#e63946" stroke-width="13" stroke-linecap="round"/>
    </g>

    <!-- 脖子 -->
    <path d="M456 226 C478 200 470 158 500 132" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round"/>

    <!-- 头 -->
    <circle cx="485" cy="106" r="9" fill="#ffffff"/>
    <circle cx="505" cy="125" r="27" fill="#ffffff" stroke="#d3dde4" stroke-width="2"/>

    <!-- 喉囊 -->
    <path d="M524 125 C545 172 585 176 615 160 C636 149 648 138 650 132 Z" fill="#ffb4a2" stroke="#e76f51" stroke-width="2" stroke-linejoin="round"/>
    <path d="M536 132 C560 158 596 160 626 144" fill="none" stroke="#e76f51" stroke-width="2" opacity="0.55"/>

    <!-- 上喙 -->
    <path d="M522 108 L650 131 L524 125 Z" fill="#f6a04d" stroke="#e0883c" stroke-width="2" stroke-linejoin="round"/>

    <!-- 眼睛 -->
    <circle cx="513" cy="116" r="4.2" fill="#26313d"/>
    <circle cx="514.6" cy="114.4" r="1.4" fill="#ffffff"/>
    <!-- 腮红 -->
    <circle cx="506" cy="142" r="5" fill="#ffb4a2" opacity="0.5"/>

    <!-- 围巾结（系在脖子上） -->
    <circle cx="472" cy="198" r="13" fill="#e63946"/>
    <path d="M463 192 C469 200 479 202 485 196" fill="none" stroke="#c1121f" stroke-width="3" stroke-linecap="round"/>

    <!-- 翅膀（扇动） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-8 385 215; 16 385 215; -8 385 215" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" dur="1s" repeatCount="indefinite"/>
      <path d="M378 202 C352 214 330 254 340 294 C344 314 362 320 374 306 C390 288 398 246 392 214 C390 202 386 198 378 202 Z" fill="#f2f6f9" stroke="#c3d0da" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M352 252 C358 274 364 290 370 302" fill="none" stroke="#d3dde4" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M366 244 C371 266 376 282 380 294" fill="none" stroke="#d3dde4" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round">
    <line x1="238" y1="168" x2="294" y2="168">
      <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.4;1" dur="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="222" y1="206" x2="288" y2="206">
      <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.4;1" dur="0.5s" begin="0.17s" repeatCount="indefinite"/>
    </line>
    <line x1="246" y1="244" x2="292" y2="244">
      <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.4;1" dur="0.5s" begin="0.33s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
</div>

<p class="caption">纯 SVG + SMIL 动画 · 零依赖 · 一只努力踩脚踏车的鹈鹕 🐟</p>

</body>
</html>
