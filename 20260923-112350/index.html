    <section class="hero" aria-labelledby="page-title"><div class="eyebrow">给生活一点慢悠悠</div><h1 id="page-title">今天，<em>骑慢一点。</em></h1><p>风是甜的，路是长的。和奶龙一起，出发去收集好心情。</p><svg class="hero-doodle" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m7 23 5-6m9-4 1-8m9 13 6-4M16 30l7 2"/></svg></section>

  <script>
    (()=>{
      'use strict';
      const $=id=>document.getElementById(id), scene=$('scene');
      const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let running=!reducedMotion, speed=1, elapsed=0, distance=0, joy=1, night=false, sound=false, audio=null, toastTimer, speechTimer;
      const speeds=[1,1.5,2,.5];
      function icon(button,name){button.querySelector('use').setAttribute('href','#icon-'+name)}
      function toast(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2300)}
      function say(message){$('speech').textContent=message;clearTimeout(speechTimer);speechTimer=setTimeout(()=>$('speech').textContent=running?(night?'月亮也来兜风啦！':'嘿嘿，出发咯！'):'慢慢来，不着急～',3200)}
      function setRunning(next){running=next;document.body.classList.toggle('paused',!running);if(reducedMotion&&running){document.body.classList.add('motion-enabled')}icon($('playBtn'),running?'pause':'play');$('playBtn').querySelector('span').textContent=running?'歇一小会':'继续出发';$('playBtn').setAttribute('aria-label',running?'暂停骑行':'继续骑行');$('playBtn').setAttribute('aria-pressed',String(!running));scene.getAnimations({subtree:true}).forEach(a=>{a.playbackRate=speed;if(running)a.play();else a.pause()});say(running?'嘿嘿，出发咯！':'慢慢来，不着急～')}
      $('playBtn').addEventListener('click',()=>setRunning(!running));
      $('speedBtn').addEventListener('click',()=>{speed=speeds[(speeds.indexOf(speed)+1)%speeds.length];$('speedBtn').querySelector('span').textContent=speed+'×';$('speedBtn').setAttribute('aria-label',`骑行速度 ${speed} 倍，点击切换`);scene.getAnimations({subtree:true}).forEach(a=>a.updatePlaybackRate(speed));say(speed===2?'小短腿，加把劲！':speed===.5?'慢悠悠，才舒服～':'风追上来啦！');toast('骑行速度 · '+speed+'×')});
      async function ensureAudio(){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')await audio.resume();return audio.state==='running'}catch{return false}}
      function tone(freq,start,duration,gain=.12,type='sine'){if(!audio)return;const oscillator=audio.createOscillator(),volume=audio.createGain();oscillator.type=type;oscillator.frequency.setValueAtTime(freq,start);volume.gain.setValueAtTime(0,start);volume.gain.linearRampToValueAtTime(gain,start+.008);volume.gain.exponentialRampToValueAtTime(.0001,start+duration);oscillator.connect(volume);volume.connect(audio.destination);oscillator.start(start);oscillator.stop(start+duration+.05)}
      async function ring(){const btn=$('bellBtn');btn.classList.remove('ringing');void btn.offsetWidth;btn.classList.add('ringing');setTimeout(()=>btn.classList.remove('ringing'),1000);say('叮铃铃～快乐借过！');burst(8,false);if(await ensureAudio()){const t=audio.currentTime;tone(1480,t,.7,.10);tone(2217,t,.4,.04);tone(1760,t+.16,.85,.085);tone(2640,t+.16,.5,.025)}}
      $('bellBtn').addEventListener('click',ring);
      $('soundBtn').addEventListener('click',async()=>{if(!sound&&!(await ensureAudio())){toast('浏览器暂时无法播放声音');return}sound=!sound;icon($('soundBtn'),sound?'volume':'mute');const label=sound?'关闭声音':'打开声音';$('soundBtn').setAttribute('aria-label',label);$('soundBtn').setAttribute('title',label);$('soundBtn').setAttribute('aria-pressed',String(sound));toast(sound?'声音已打开 · 听听风里的小鸟':'声音已关闭');if(sound){const t=audio.currentTime;tone(1568,t,.3,.025);tone(2093,t+.16,.3,.02)}});
      setInterval(()=>{if(!sound||!running||document.hidden||!audio)return;const t=audio.currentTime,f=night?880:1900;tone(f,t,.2,.013);tone(f*1.2,t+.16,.24,.01);tone(f*.9,t+.37,.17,.008)},4800);
      $('themeBtn').addEventListener('click',()=>{night=!night;document.body.classList.toggle('night',night);icon($('themeBtn'),night?'sun':'moon');const label=night?'切换到白天':'切换到夜晚';$('themeBtn').setAttribute('aria-label',label);$('themeBtn').setAttribute('title',label);$('themeBtn').setAttribute('aria-pressed',String(night));$('weatherIcon').setAttribute('href',night?'#icon-moon':'#icon-sun');$('weatherText').textContent=night?'19° · 月色温柔':'26° · 晴朗微风';$('gentleNote').textContent=night?'把白天的烦恼，交给晚风吧。':'偶尔漫无目的，也是很棒的目的。';scene.setAttribute('aria-label',night?'黄色的奶龙骑着珊瑚红自行车，在月光和萤火虫间穿过绿色丘陵':'黄色的奶龙骑着珊瑚红自行车，穿过微风中的绿色丘陵');say(night?'月亮也来兜风啦！':'阳光晒得暖洋洋～');scene.getAnimations({subtree:true}).forEach(a=>{a.playbackRate=speed;if(!running)a.pause()})});
      function burst(count,hearts){if(reducedMotion)return;for(let i=0;i<count;i++){const p=document.createElement('span');p.className='particle';p.textContent=hearts?['♥','✦','✿'][i%3]:['♪','♫','✦'][i%3];p.style.cssText=`left:${48+Math.random()*14}%;top:${35+Math.random()*14}%;color:${['#ec987f','#f9d574','#fff9d8'][i%3]};--dx:${(Math.random()-.5)*260}px;--dy:${-70-Math.random()*100}px;--rotate:${(Math.random()-.5)*100}deg;animation-delay:${i*.045}s`;scene.appendChild(p);setTimeout(()=>p.remove(),2400)}}
      $('collectBtn').addEventListener('click',()=>{joy++;$('joyCount').textContent=joy;burst(14,true);toast('小美好已收集 · 今天的好心情 +1');say(['又是值得开心的一天！','这份快乐，分你一半！','有你一起，真好呀！'][joy%3]);if(sound&&audio){const t=audio.currentTime;[1047,1319,1568].forEach((f,i)=>tone(f,t+i*.09,.55,.03))}});
      document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT|BUTTON/.test(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.code==='Space'){e.preventDefault();setRunning(!running)}if(e.code==='KeyB'){e.preventDefault();ring()}});
      const stars=scene.querySelector('.stars');for(let i=0;i<27;i++){const star=document.createElement('i');star.style.left=(4+(i*37)%93)+'%';star.style.top=(10+(i*17)%44)+'%';star.style.animationDelay=-(i%5)+'s';stars.appendChild(star)}
      let last=performance.now();function tick(now){const dt=Math.min((now-last)/1000,.25);last=now;if(running&&!document.hidden){elapsed+=dt;distance+=dt*speed*12/3600;const total=Math.floor(elapsed),m=Math.floor(total/60),s=total%60;$('rideTime').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('distance').textContent=distance.toFixed(2)}requestAnimationFrame(tick)}requestAnimationFrame(tick);
      document.addEventListener('visibilitychange',()=>last=performance.now());
      if(!running)setRunning(false);
    })();
  </script>
