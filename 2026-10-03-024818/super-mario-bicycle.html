<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>超级玛丽骑自行车</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 32px 16px;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #dff3ff 0%, #f4fbff 100%);
  }
  h1 {
    font-size: clamp(24px, 4vw, 40px);
    font-weight: 800;
    color: #c22a1f;
    letter-spacing: 3px;
    animation: floaty 3s ease-in-out infinite;
  }
  .card {
    width: min(960px, 94vw);
    background: #ffffff;
    border-radius: 24px;
    box-shadow: 0 24px 60px rgba(194, 42, 31, .16);
    padding: 14px;
  }
  svg { display: block; width: 100%; height: auto; border-radius: 16px; }
  .caption { color: #8a6d5b; font-size: 14px; letter-spacing: 1px; }
  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }
</style>
</head>
<body>
