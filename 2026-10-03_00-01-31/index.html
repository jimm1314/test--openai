<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑自行车 · Pelican on a Bicycle</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(1100px 640px at 50% -8%, #fdf7e6 0%, #e9f1f8 46%, #d8e4ef 100%);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  }
  .stage {
    position: relative;
    width: min(96vw, 1000px);
    aspect-ratio: 900 / 520;
    border-radius: 20px;
    overflow: hidden;
    background: #cfe8f7;
    box-shadow: 0 30px 70px -30px rgba(31, 58, 95, .45), 0 10px 28px rgba(31, 58, 95, .14);
  }
  .stage svg { display: block; width: 100%; height: 100%; }
  .caption {
    position: absolute; left: 16px; bottom: 14px;
    padding: 6px 12px; border-radius: 999px;
    background: rgba(255, 255, 255, .75);
    color: #35506b; font-size: 13px; letter-spacing: .03em;
    box-shadow: 0 2px 10px rgba(31, 58, 95, .16);
    user-select: none;
  }

  /* ===== 循环动画关键帧 ===== */
  @keyframes drift   { from { transform: translateX(0); } to { transform: translateX(var(--dx, -900px)); } }
  @keyframes dashmove{ from { stroke-dashoffset: 0; } to { stroke-dashoffset: -74; } }
  @keyframes puff    { 0% { transform: translate(0, 0) scale(.4); opacity: .55; } 100% { transform: translate(-84px, -20px) scale(1.7); opacity: 0; } }
  @keyframes spin    { to { transform: rotate(360deg); } }

  .drift { animation: drift var(--dur, 40s) linear infinite; animation-delay: var(--delay, 0s); will-change: transform; }
  .dash  { animation: dashmove .85s linear infinite; }
  .spin  { animation: spin var(--spin, 1.1s) linear infinite; }
  .puff  { opacity: 0; animation: puff 1.5s linear infinite; }
  .puff.p2 { animation-delay: .5s; }
  .puff.p3 { animation-delay: 1s; }

  @media (prefers-reduced-motion: reduce) {
    .drift, .dash, .spin, .puff { animation: none !important; }
    .puff { opacity: 0; }
  }
</style>
</head>
<body>
<main class="stage" aria-label="一只鹈鹕骑着自行车向前骑行的动画">
  <svg viewBox="0 0 900 520" role="img" aria-label="鹈鹕骑自行车的动态插画">
    <defs>
      <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"   stop-color="#a9d6f2"/>
        <stop offset=".55" stop-color="#cfe7f8"/>
        <stop offset=".86" stop-color="#eef7fc"/>
      </linearGradient>
      <linearGradient id="roadG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9aa5b1"/>
        <stop offset="1" stop-color="#7c8792"/>
      </linearGradient>
      <radialGradient id="glowG">
        <stop offset="0" stop-color="#fff3c0" stop-opacity=".9"/>
        <stop offset="1" stop-color="#fff3c0" stop-opacity="0"/>
      </radialGradient>
      <path id="hillsFar"  d="M0 430 C70 430 95 372 160 368 C225 364 250 430 320 430 C380 430 405 350 470 348 C535 346 560 430 630 430 C690 430 715 380 780 376 C845 372 870 430 900 430 Z" fill="#b9dfb4"/>
      <path id="hillsNear" d="M0 430 C50 430 80 396 140 392 C200 388 220 430 300 430 C340 430 380 372 440 370 C500 368 530 430 610 430 C660 430 690 402 750 400 C810 398 840 430 900 430 Z" fill="#8ecf8a"/>
    </defs>

    <!-- 天空 -->
    <rect width="900" height="520" fill="url(#skyG)"/>

    <!-- 太阳（光晕 + 缓慢旋转的光芒） -->
    <g transform="translate(790 92)">
      <circle r="95" fill="url(#glowG)"/>
      <g class="spin" style="--spin:80s" stroke="#f7c948" stroke-width="5" stroke-linecap="round" opacity=".85">
        <line x1="52" y1="0" x2="70" y2="0" transform="rotate(0)"/>
        <line x1="52" y1="0" x2="70" y2="0" transform="rotate(45)"/>
        <line x1="52" y1="0" x2="70" y2="0" transform="rotate(90)"/>
        <line x1="52" y1="0" x2="70" y2="0" transform="rotate(135)"/>
        <line x1="52" y1="0" x2="70" y2="0" transform="rotate(180)"/>
        <line x1="52" y1="0" x2="70" y2="0" transform="rotate(225)"/>
        <line x1="52" y1="0" x2="70" y2="0" transform="rotate(270)"/>
        <line x1="52" y1="0" x2="70" y2="0" transform="rotate(315)"/>
      </g>
      <circle r="40" fill="#ffd66e" stroke="#f7c948" stroke-width="3"/>
    </g>

    <!-- 远处的小鸟 -->
    <g transform="translate(700 126)">
      <g class="drift" style="--dx:-1650px; --dur:66s; --delay:-6s" stroke="#7286a0" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".65">
        <path d="M0 0 q7 -8 14 0 q7 -8 14 0"/>
        <path d="M44 14 q6 -7 12 0 q6 -7 12 0" transform="scale(.85)"/>
      </g>
    </g>

    <!-- 云朵 -->
    <g transform="translate(1120 96)">
      <g class="drift" style="--dx:-1460px; --dur:58s; --delay:-18s" fill="#ffffff" opacity=".95">
        <ellipse rx="58" ry="24"/>
        <ellipse cx="-42" cy="10" rx="34" ry="17"/>
        <ellipse cx="44" cy="12" rx="40" ry="19"/>
      </g>
    </g>
    <g transform="translate(540 64)">
      <g transform="scale(.7)">
        <g class="drift" style="--dx:-1460px; --dur:74s; --delay:-20s" fill="#ffffff" opacity=".9">
          <ellipse rx="58" ry="24"/>
          <ellipse cx="-42" cy="10" rx="34" ry="17"/>
          <ellipse cx="44" cy="12" rx="40" ry="19"/>
        </g>
      </g>
    </g>
    <g transform="translate(800 140)">
      <g transform="scale(.55)">
        <g class="drift" style="--dx:-1460px; --dur:46s; --delay:-10s" fill="#ffffff" opacity=".9">
          <ellipse rx="58" ry="24"/>
          <ellipse cx="-42" cy="10" rx="34" ry="17"/>
          <ellipse cx="44" cy="12" rx="40" ry="19"/>
        </g>
      </g>
    </g>
    <g transform="translate(1280 78)">
      <g transform="scale(.85)">
        <g class="drift" style="--dx:-1460px; --dur:78s; --delay:-55s" fill="#ffffff" opacity=".92">
          <ellipse rx="58" ry="24"/>
          <ellipse cx="-42" cy="10" rx="34" ry="17"/>
          <ellipse cx="44" cy="12" rx="40" ry="19"/>
        </g>
      </g>
    </g>

    <!-- 远山、近山（视差滚动） -->
    <g opacity=".9">
      <g class="drift" style="--dx:-900px; --dur:36s">
        <use href="#hillsFar"/>
        <use href="#hillsFar" transform="translate(900 0)"/>
      </g>
    </g>
    <g opacity=".96">
      <g class="drift" style="--dx:-900px; --dur:18s">
        <use href="#hillsNear"/>
        <use href="#hillsNear" transform="translate(900 0)"/>
      </g>
    </g>

    <!-- 马路 -->
    <rect x="0" y="430" width="900" height="90" fill="url(#roadG)"/>
    <line x1="0" y1="431" x2="900" y2="431" stroke="#eef3f7" stroke-width="3" opacity=".55"/>
    <line class="dash" x1="-40" y1="474" x2="940" y2="474" stroke="#f2f6f9" stroke-width="6" stroke-dasharray="34 40"/>

    <!-- 路面上翻滚的小叶子 -->
    <g transform="translate(950 478)">
      <g class="drift" style="--dx:-1040px; --dur:6s; --delay:-2s">
        <g class="spin">
          <path d="M-9 0 Q0 -9 9 0 Q0 9 -9 0 Z" fill="#85c47c" stroke="#6aa763" stroke-width="1.2"/>
        </g>
      </g>
    </g>

    <!-- 车底阴影 -->
    <ellipse cx="450" cy="433" rx="215" ry="9" fill="#22303f" opacity=".16"/>

    <!-- 远侧曲柄（深色，画在车架后面） -->
    <g transform="translate(422 384)">
      <g id="crankFar">
        <line x1="0" y1="0" x2="-20" y2="0" stroke="#2b333b" stroke-width="5" stroke-linecap="round"/>
        <rect x="-29" y="-3.5" width="14" height="7" rx="2" fill="#2b333b"/>
      </g>
    </g>

    <!-- 远侧腿（深色） -->
    <polyline id="legFarUp"  points="398,284 435,334" fill="none" stroke="#c9822a" stroke-width="9"   stroke-linecap="round" stroke-linejoin="round"/>
    <polyline id="legFarLow" points="435,334 402,384" fill="none" stroke="#c9822a" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse id="footFar" rx="9" ry="4.5" fill="#b8781f" transform="translate(402 384)"/>

    <!-- 车轮 -->
    <g transform="translate(330 382)">
      <circle r="48" fill="none" stroke="#38424c" stroke-width="7"/>
      <g id="spokesRear"></g>
      <circle r="41" fill="none" stroke="#cfd6dd" stroke-width="3"/>
      <circle r="4.5" fill="#6b7683"/>
    </g>
    <g transform="translate(570 382)">
      <circle r="48" fill="none" stroke="#38424c" stroke-width="7"/>
      <g id="spokesFront"></g>
      <circle r="41" fill="none" stroke="#cfd6dd" stroke-width="3"/>
      <circle r="4.5" fill="#6b7683"/>
    </g>

    <!-- 车架、链条、车座、车把 -->
    <g stroke="#2e7d9e" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M330 382 L422 384"/>
      <path d="M330 382 L394 297"/>
      <path d="M422 384 L395 297"/>
      <path d="M422 384 L554 272"/>
      <path d="M394 296 L552 272"/>
      <path d="M552 272 L560 259"/>
      <path d="M554 272 L570 382"/>
    </g>
    <g stroke="#5a616b" stroke-width="2.5" fill="none">
      <line x1="330" y1="375" x2="422" y2="372"/>
      <line x1="330" y1="389" x2="422" y2="397"/>
    </g>
    <circle cx="422" cy="384" r="14" fill="none" stroke="#8d949e" stroke-width="2.5"/>
    <path d="M370 290 Q394 276 424 288 Q420 296 396 297 Q376 296 370 290 Z" fill="#6b4a36"/>
    <path d="M534 262 Q558 248 584 257" stroke="#38424c" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="539" cy="261" r="5.5" fill="#2b333b"/>
    <circle cx="581" cy="256.5" r="5.5" fill="#2b333b"/>

    <!-- 鹈鹕（整体随踩踏轻微上下起伏） -->
    <g id="bodyG">
      <!-- 尾羽 -->
      <path d="M356 244 C330 236 314 220 308 202 C318 212 328 212 334 206 C338 218 348 224 360 220 C354 230 353 238 356 244 Z" fill="#f1ebdf" stroke="#e2d9c8" stroke-width="1"/>
      <!-- 身体 -->
      <ellipse cx="402" cy="252" rx="60" ry="46" fill="#fbf8f2" transform="rotate(-8 402 252)"/>
      <ellipse cx="400" cy="280" rx="46" ry="15" fill="#ece4d4" opacity=".55"/>
      <!-- 脖子 -->
      <path d="M446 232 Q466 212 474 188" stroke="#fbf8f2" stroke-width="30" stroke-linecap="round" fill="none"/>
      <!-- 头 -->
      <g id="headG">
        <circle cx="486" cy="170" r="27" fill="#fbf8f2"/>
        <!-- 眼睛 -->
        <circle cx="498" cy="158" r="5" fill="#2b2b2b"/>
        <circle cx="500" cy="156" r="1.8" fill="#ffffff"/>
        <path d="M488 147 Q497 142 507 147" stroke="#d9cdb7" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <!-- 上喙 -->
        <path d="M507 158 C545 158 590 164 614 171 C623 174 624 182 615 183 L507 178 Z" fill="#f5a93f"/>
        <!-- 上下喙分界线 -->
        <path d="M507 178 C545 181 585 183 613 182" stroke="#d98a2b" stroke-width="2" fill="none"/>
        <!-- 喉囊 -->
        <path d="M508 178 C532 184 558 188 584 186 C600 185 610 183 615 182 C603 208 570 222 540 217 C519 213 508 198 508 178 Z" fill="#f6bd57"/>
        <path d="M520 188 C530 200 545 209 562 212" stroke="#e0a63f" stroke-width="1.6" fill="none" opacity=".75"/>
        <path d="M540 190 C548 200 560 206 574 208" stroke="#e0a63f" stroke-width="1.6" fill="none" opacity=".75"/>
        <!-- 喉囊里露出的小鱼尾巴 -->
        <g id="fishG">
          <path d="M600 188 L613 180 L609 190 L616 197 L601 194 Z" fill="#8ec6e6" stroke="#5d9fc4" stroke-width="1.5" stroke-linejoin="round"/>
        </g>
      </g>
      <!-- 红围巾（随速度飘动） -->
      <path d="M450 214 Q470 203 490 207" stroke="#e35d5d" stroke-width="11" stroke-linecap="round" fill="none"/>
      <path id="scarf1" d="M458,212 C438,204 424,216 404,208 C388,202 374,214 356,206" stroke="#e35d5d" stroke-width="8"  stroke-linecap="round" fill="none"/>
      <path id="scarf2" d="M456,216 C436,212 420,222 400,214 C384,208 372,220 354,214" stroke="#c94a4a" stroke-width="6"  stroke-linecap="round" fill="none" opacity=".92"/>
      <!-- 翅膀（搭在车把上，随踩踏轻微摆动） -->
      <g id="wingG">
        <path d="M418 232 C452 222 492 226 520 242 C542 253 560 246 560 258 C560 272 538 278 512 270 C484 260 448 252 424 246 C414 240 412 236 418 232 Z" fill="#f6f1e6"/>
        <path d="M468 244 q11 8 5 17"  stroke="#ded3bf" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M494 252 q11 7 6 16"  stroke="#ded3bf" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M518 258 q9 6 5 14"   stroke="#ded3bf" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>
    </g>

    <!-- 近侧曲柄 -->
    <g transform="translate(422 384)">
      <g id="crankNear">
        <line x1="0" y1="0" x2="20" y2="0" stroke="#3a444e" stroke-width="5" stroke-linecap="round"/>
        <rect x="15" y="-3.5" width="14" height="7" rx="2" fill="#2b333b"/>
      </g>
    </g>

    <!-- 近侧腿 -->
    <polyline id="legNearUp"  points="410,286 457,326" fill="none" stroke="#f2a63c" stroke-width="9"   stroke-linecap="round" stroke-linejoin="round"/>
    <polyline id="legNearLow" points="457,326 442,384" fill="none" stroke="#efa13c" stroke-width="7"   stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse id="footNear" rx="9" ry="4.5" fill="#e5952f" transform="translate(442 384)"/>

    <!-- 后轮扬起的尘土 -->
    <g transform="translate(272 424)"><g class="puff"><ellipse rx="9" ry="6" fill="#d6dee7"/></g></g>
    <g transform="translate(268 417)"><g class="puff p2"><ellipse rx="9" ry="6" fill="#d6dee7"/></g></g>
    <g transform="translate(276 429)"><g class="puff p3"><ellipse rx="9" ry="6" fill="#d6dee7"/></g></g>
  </svg>
  <div class="caption">🐦 鹈鹕骑车 · Pelican on a Bicycle</div>
</main>

<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);

  // ---- 生成车轮辐条 ----
  function addSpokes(id, r) {
    const g = $(id);
    for (let k = 0; k < 8; k++) {
      const a = k * Math.PI / 4;
      const l = document.createElementNS(NS, 'line');
      l.setAttribute('x2', (r * Math.cos(a)).toFixed(2));
      l.setAttribute('y2', (r * Math.sin(a)).toFixed(2));
      l.setAttribute('stroke', '#b9c1cb');
      l.setAttribute('stroke-width', '2');
      g.appendChild(l);
    }
  }
  addSpokes('spokesRear', 40);
  addSpokes('spokesFront', 40);

  // ---- 踩踏的两段腿 IK ----
  const C = { x: 422, y: 384 }, R = 20;                 // 中轴与曲柄半径
  const HIP = { near: { x: 410, y: 286 }, far: { x: 398, y: 284 } };
  const L1 = 62, L2 = 60;                               // 大腿 / 小腿长度

  function solveKnee(hip, pedal) {
    const dx = pedal.x - hip.x, dy = pedal.y - hip.y;
    let d = Math.hypot(dx, dy);
    d = Math.min(Math.max(d, Math.abs(L1 - L2) + 1), L1 + L2 - 1);
    const base = Math.atan2(dy, dx);
    const cosA = Math.min(1, Math.max(-1, (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d)));
    const alpha = Math.acos(cosA);
    const k1 = { x: hip.x + L1 * Math.cos(base - alpha), y: hip.y + L1 * Math.sin(base - alpha) };
    const k2 = { x: hip.x + L1 * Math.cos(base + alpha), y: hip.y + L1 * Math.sin(base + alpha) };
    return k1.x >= k2.x ? k1 : k2;                       // 膝盖朝前
  }

  const el = {
    body: $('bodyG'), head: $('headG'), wing: $('wingG'),
    spokesR: $('spokesRear'), spokesF: $('spokesFront'),
    crankN: $('crankNear'), crankF: $('crankFar'),
    upN: $('legNearUp'), loN: $('legNearLow'), footN: $('footNear'),
    upF: $('legFarUp'), loF: $('legFarLow'), footF: $('footFar'),
    scarf1: $('scarf1'), scarf2: $('scarf2'), fish: $('fishG'),
  };

  const DEG = 180 / Math.PI;

  function setLeg(up, lo, foot, hip, pedal, tilt) {
    const k = solveKnee(hip, pedal);
    up.setAttribute('points', `${hip.x},${hip.y} ${k.x.toFixed(1)},${k.y.toFixed(1)}`);
    lo.setAttribute('points', `${k.x.toFixed(1)},${k.y.toFixed(1)} ${pedal.x.toFixed(1)},${pedal.y.toFixed(1)}`);
    foot.setAttribute('transform', `translate(${pedal.x.toFixed(1)} ${pedal.y.toFixed(1)}) rotate(${tilt.toFixed(1)})`);
  }

  let t = 0, last = performance.now();

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!reduced) t += dt;

    const wa = t * 5.4;                                  // 车轮角速度
    const ca = t * 2.4;                                  // 曲柄角速度
    const waDeg = (wa * DEG) % 360, caDeg = (ca * DEG) % 360;

    el.spokesR.setAttribute('transform', `rotate(${waDeg.toFixed(1)})`);
    el.spokesF.setAttribute('transform', `rotate(${waDeg.toFixed(1)})`);
    el.crankN.setAttribute('transform', `rotate(${caDeg.toFixed(1)})`);
    el.crankF.setAttribute('transform', `rotate(${caDeg.toFixed(1)})`);

    const pN = { x: C.x + R * Math.cos(ca), y: C.y + R * Math.sin(ca) };  // 近侧踏板
    const pF = { x: C.x - R * Math.cos(ca), y: C.y - R * Math.sin(ca) };  // 远侧踏板（反相）
    setLeg(el.upF, el.loF, el.footF, HIP.far, pF, 8 * Math.sin(ca + Math.PI));
    setLeg(el.upN, el.loN, el.footN, HIP.near, pN, 8 * Math.sin(ca));

    const bob = 1.5 * Math.sin(2 * ca);                  // 身体随踩踏起伏
    el.body.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
    el.head.setAttribute('transform', `rotate(${(2 * Math.sin(2 * ca)).toFixed(2)} 474 192)`);
    el.wing.setAttribute('transform', `rotate(${(1.4 * Math.sin(2 * ca - 0.7)).toFixed(2)} 420 236)`);

    const s1 = 3.5 * Math.sin(6 * t), s2 = 5 * Math.sin(6 * t + 1), s3 = 4 * Math.sin(6 * t + 2);
    const s4 = 3.5 * Math.sin(6 * t + 2.5), s5 = 5 * Math.sin(6 * t + 3.5);
    el.scarf1.setAttribute('d',
      `M458,212 C438,${(204 + s2).toFixed(1)} 424,${(216 - s2).toFixed(1)} 404,${(208 + s2).toFixed(1)} ` +
      `C388,${(202 + s3).toFixed(1)} 374,${(214 - s3).toFixed(1)} 356,${(206 + s1).toFixed(1)}`);
    el.scarf2.setAttribute('d',
      `M456,216 C436,${(212 + s5).toFixed(1)} 420,${(222 - s5).toFixed(1)} 400,${(214 + s5).toFixed(1)} ` +
      `C384,${(208 - s4).toFixed(1)} 372,${(220 - s4).toFixed(1)} 354,${(214 + s4).toFixed(1)}`);
    el.fish.setAttribute('transform', `rotate(${(9 * Math.sin(7 * t)).toFixed(1)} 603 190)`);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
