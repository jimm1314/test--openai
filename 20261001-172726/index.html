<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑行日</title>
<style>
  :root{
    --ink:#17324d;
    --cream:#fff8e7;
    --water:#4da8bf;
    --road:#f3c978;
    --accent:#ef7b4d;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:grid;place-items:center;overflow:hidden;
    background:#0f2136;color:var(--ink);
    font-family:ui-rounded,"SF Pro Rounded","PingFang SC",system-ui,sans-serif;
  }
  .wrap{
    width:min(100vw,1100px);padding:18px;
    filter:drop-shadow(0 18px 32px rgba(0,0,0,.28));
  }
  .card{
    position:relative;overflow:hidden;border-radius:28px;
    background:#bcecf2;border:1px solid rgba(255,255,255,.45);
  }
  svg{display:block;width:100%;height:auto;aspect-ratio:16/9}
  .hud{
    position:absolute;inset:16px 18px auto 18px;
    display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
    pointer-events:none;
  }
  .title{
    padding:12px 16px;border-radius:16px;
    background:rgba(255,255,255,.72);backdrop-filter:blur(10px);
    box-shadow:0 6px 18px rgba(40,77,95,.12);
  }
  .title strong{display:block;font-size:clamp(16px,2.2vw,24px);letter-spacing:.03em}
  .title span{display:block;margin-top:3px;font-size:12px;opacity:.68}
  .controls{
    pointer-events:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end;
    padding:9px 11px;border-radius:16px;background:rgba(255,255,255,.72);backdrop-filter:blur(10px);
  }
  button{
    border:0;border-radius:10px;padding:8px 11px;cursor:pointer;
    color:#fff;background:var(--ink);font:600 12px inherit;
    transition:transform .18s ease,background .18s ease;
  }
  button:hover{transform:translateY(-1px);background:#285271}
  button:active{transform:translateY(0)}
  label{font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap}
  input[type=range]{width:82px;accent-color:var(--accent)}
  .metric{
    position:absolute;left:18px;bottom:16px;
    padding:8px 11px;border-radius:12px;font-size:12px;
    background:rgba(255,255,255,.66);backdrop-filter:blur(8px);
  }
  .metric b{font-size:16px;color:var(--accent)}
  .cloud{animation:drift 26s linear infinite}
  .cloud.slow{animation-duration:38s;animation-delay:-14s}
  .cloud.fast{animation-duration:20s;animation-delay:-8s}
  .wave{animation:wave 4s ease-in-out infinite}
  .wave.w2{animation-delay:-2s;opacity:.55}
  .wheel{transform-box:fill-box;transform-origin:center;animation:spin .95s linear infinite}
  .wing{transform-box:fill-box;transform-origin:78% 72%;animation:flap 1.2s ease-in-out infinite}
  .body-bob{transform-box:fill-box;transform-origin:center;animation:bob 1.55s ease-in-out infinite}
  .head-bob{transform-box:fill-box;transform-origin:bottom center;animation:headbob 1.55s ease-in-out infinite}
  .leg-a{transform-box:fill-box;transform-origin:top center;animation:pedalA .95s linear infinite}
  .leg-b{transform-box:fill-box;transform-origin:top center;animation:pedalB .95s linear infinite}
  .blink{animation:blink 5.5s ease-in-out infinite}
  .dust{animation:dust 1.1s ease-out infinite}
  .dust.d2{animation-delay:-.42s}.dust.d3{animation-delay:-.75s}
  .roadmark{animation:road 1.1s linear infinite}
  .roadmark.r2{animation-delay:-.55s}
  .status-dot{fill:#3ac47b;animation:ping 1.4s ease-in-out infinite}
  .paused .cloud,.paused .wave,.paused .wheel,.paused .wing,.paused .body-bob,.paused .head-bob,
  .paused .leg-a,.paused .leg-b,.paused .blink,.paused .dust,.paused .roadmark,.paused .status-dot{animation-play-state:paused}
  @keyframes drift{from{transform:translateX(-180px)}to{transform:translateX(1060px)}}
  @keyframes wave{0%,100%{transform:translateX(0)}50%{transform:translateX(13px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes flap{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(9deg)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes headbob{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(2deg)}}
  @keyframes pedalA{0%{transform:rotate(20deg)}50%{transform:rotate(-24deg)}100%{transform:rotate(20deg)}}
  @keyframes pedalB{0%{transform:rotate(-24deg)}50%{transform:rotate(20deg)}100%{transform:rotate(-24deg)}}
  @keyframes blink{0%,45%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.08)}}
  @keyframes dust{0%{opacity:0;transform:translate(0,0) scale(.45)}20%{opacity:.7}100%{opacity:0;transform:translate(-28px,-17px) scale(1.35)}}
  @keyframes road{to{transform:translateX(-120px)}}
  @keyframes ping{0%,100%{opacity:.45}50%{opacity:1}}
  @media (max-width:650px){
    .wrap{padding:8px}.hud{inset:9px}.title span{display:none}
    .controls{padding:7px}.controls label{display:none}.metric{left:9px;bottom:9px}
  }
  @media (prefers-reduced-motion:reduce){
    .cloud,.wave,.wheel,.wing,.body-bob,.head-bob,.leg-a,.leg-b,.blink,.dust,.roadmark,.status-dot{animation:none!important}
  }
</style>
</head>
<body>
<main class="wrap">
  <section class="card" id="card" aria-label="动态插画：鹈鹕骑自行车">
    <svg viewBox="0 0 960 540" role="img" aria-labelledby="sceneTitle sceneDesc">
      <title id="sceneTitle">鹈鹕骑自行车穿过海边</title>
      <desc id="sceneDesc">一只白色鹈鹕骑着橙色自行车沿着海边公路前进，云朵、海浪和道路都在移动。</desc>

        <path class="wave w2" d="M-30 468 q42 -13 84 0 t84 0 t84 0 t84 0 t84 0 t84 0 t84 0 t84 0 t84 0 t84 0 t84 0"/>

      <g fill="#fff1bd" opacity=".75">

        <rect class="roadmark" x="236" y="423" width="86" height="8" rx="4"/>
        <rect class="roadmark" x="438" y="411" width="86" height="8" rx="4"/>
        <rect class="roadmark" x="640" y="410" width="86" height="8" rx="4"/>

    <div class="hud">
      <div class="title"><strong>鹈鹕骑行日</strong><span>海风、车轮和一点点橙色勇气</span></div>
      <div class="controls">
        <button id="toggle" type="button">暂停</button>
        <label>速度 <input id="speed" type="range" min="0.5" max="2.4" step="0.1" value="1"></label>
        <button id="reset" type="button">重置</button>
      </div>
    </div>
    <div class="metric">今日已骑 <b id="distance">0.0</b> km</div>
  </section>
</main>

<script>
(() => {
  const card = document.getElementById('card');
  const rider = document.getElementById('rider');
  const toggle = document.getElementById('toggle');
  const reset = document.getElementById('reset');
  const speed = document.getElementById('speed');
  const distance = document.getElementById('distance');
  let running = true;
  let startedAt = performance.now();
  let pausedAt = 0;
  let offset = -190;
  let last = startedAt;
  let travelled = 0;

  function setPaused(value) {
    running = !value;
    card.classList.toggle('paused', value);
    toggle.textContent = value ? '继续' : '暂停';
    if (value) pausedAt = performance.now();
    else {
      const now = performance.now();
      startedAt += now - pausedAt;
      last = now;
    }
  }

  function frame(now) {
    const dt = Math.min(64, now - last);
    last = now;
    if (running) {
      const factor = Number(speed.value);
      const width = card.clientWidth || 960;
      const travelWidth = 960 + 380;
      offset += dt * 0.095 * factor;
      travelled += dt * 0.000021 * factor;
      if (offset > 980) offset = -190;
      rider.setAttribute('transform', 'translate(' + offset.toFixed(2) + ' 0)');
      distance.textContent = travelled.toFixed(1);
      card.style.setProperty('--ride-width', width + 'px');
    }
    requestAnimationFrame(frame);
  }

  toggle.addEventListener('click', () => setPaused(running));
  reset.addEventListener('click', () => {
    offset = -190;
    travelled = 0;
    distance.textContent = '0.0';
    if (!running) setPaused(false);
  });
  speed.addEventListener('input', () => {
    document.documentElement.style.setProperty('--ride-speed', speed.value);
  });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
