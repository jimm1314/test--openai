<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>玛丽跳 · 普通关卡</title>
  <style>
    :root{--ink:#17243b;--cream:#fff3c9;--red:#e83232}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18253d;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:var(--ink)}
    body{display:grid;place-items:center}
    .wrap{position:relative;width:min(1100px,100vw);height:min(700px,100vh);overflow:hidden;background:#70d8f5;box-shadow:0 18px 60px #0007}
    canvas{display:block;width:100%;height:100%;image-rendering:auto;touch-action:none}
    .hud{position:absolute;top:16px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
    .brand{color:#fff;font-weight:1000;font-size:clamp(20px,3.3vw,36px);line-height:.9;text-shadow:3px 4px 0 #9c2323;letter-spacing:.02em}
    .brand small{display:block;margin-top:8px;font-size:clamp(9px,1vw,12px);letter-spacing:.2em;color:#fff3a4;text-shadow:1px 2px #17243b}
    .stats{display:flex;gap:8px}.stat{min-width:75px;padding:6px 9px;border:3px solid var(--ink);border-radius:11px;background:var(--cream);box-shadow:0 4px 0 var(--ink);font-size:10px;font-weight:900;text-align:center}.stat b{display:block;color:var(--red);font-size:20px;line-height:1.1}
    .buttons{position:absolute;right:18px;bottom:16px;z-index:4;display:flex;gap:8px}.btn{padding:8px 12px;border:3px solid var(--ink);border-radius:10px;background:var(--cream);box-shadow:0 4px 0 var(--ink);cursor:pointer;font-weight:900;color:var(--ink)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
    .help{position:absolute;left:18px;bottom:18px;padding:8px 10px;border-radius:9px;background:#fff9dccc;font-size:12px;font-weight:800;z-index:3}
    .touch{display:none;position:absolute;left:15px;right:15px;bottom:14px;justify-content:space-between;z-index:5;pointer-events:none}.touch-group{display:flex;gap:8px}.touch button{pointer-events:auto;width:58px;height:52px;border:3px solid var(--ink);border-radius:14px;background:#fff4c9dd;color:var(--ink);font-size:23px;font-weight:1000;box-shadow:0 4px 0 var(--ink);touch-action:none}.touch button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
    .modal{position:absolute;inset:0;display:grid;place-items:center;background:#17243b88;z-index:10}.modal[hidden]{display:none}.card{width:min(360px,85%);padding:27px;text-align:center;border:5px solid var(--ink);border-radius:20px;background:var(--cream);box-shadow:0 8px 0 var(--ink)}.card h1{margin:0 0 8px;color:var(--red);font-size:32px}.card p{margin:8px 0 18px;font-weight:800}.card button{padding:10px 24px;border:3px solid var(--ink);border-radius:11px;background:var(--red);color:#fff;font-weight:1000;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
    @media(max-width:650px){.wrap{height:100vh}.stats .stat:nth-child(2){display:none}.help{bottom:77px;font-size:10px}.buttons{top:82px;bottom:auto}.touch{display:flex}.brand small{display:none}}
  </style>
</head>
<body>
  <main class="wrap" id="game">
    <canvas id="screen" aria-label="玛丽跳普通关卡"></canvas>
    <header class="hud"><div class="brand">玛丽跳<small>WORLD 1-1 · 普通关卡</small></div><div class="stats"><div class="stat">得分<b id="score">000000</b></div><div class="stat">金币<b id="coins">00</b></div><div class="stat">生命<b id="lives">03</b></div></div></header>
    <div class="help">← → 移动　↑ / 空格 跳跃　P 暂停</div>
    <div class="buttons"><button class="btn" id="pause">Ⅱ 暂停</button><button class="btn" id="restart">↻ 重开</button></div>
    <div class="touch"><div class="touch-group"><button data-key="left">←</button><button data-key="right">→</button></div><button data-key="jump">↑</button></div>
    <div class="modal" id="modal" hidden><div class="card"><h1 id="modalTitle">关卡完成！</h1><p id="modalText"></p><button id="modalButton">再玩一次</button></div></div>
  </main>
  <script>
    'use strict';
    const canvas=document.getElementById('screen'),ctx=canvas.getContext('2d');
    const W=1100,H=700,T=50,world={w:4800,h:700};
    let scale=1,view={x:0},keys={},last=0,paused=false,ended=false;
    let player,blocks,coins,enemies,particles,score,coinCount,lives;
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
    function resize(){const r=canvas.getBoundingClientRect();scale=Math.min(r.width/W,r.height/H);canvas.width=Math.round(r.width);canvas.height=Math.round(r.height)}
    addEventListener('resize',resize);resize();
    function rect(x,y,w,h,type='ground'){return{x,y,w,h,type,hit:false}}
    function reset(){
      player={x:100,y:450,w:34,h:48,vx:0,vy:0,onGround:false,face:1,inv:0,walk:0};
      blocks=[rect(0,610,1200,90),rect(1300,610,1100,90),rect(2550,610,1100,90),rect(3750,610,1050,90),rect(1250,530,85,80,'pipe'),rect(3650,530,85,80,'pipe')];
      [[300,460],[350,410],[400,360],[800,470],[850,420],[900,370],[1530,470],[1580,420],[1630,370],[2140,470],[2190,420],[2240,370],[2860,460],[2910,410],[2960,360],[3350,460],[3400,410],[3450,360],[4050,470],[4100,420]].forEach(([x,y])=>blocks.push(rect(x,y,50,50,'brick')));
      [[450,310],[500,310],[550,310],[950,280],[1000,280],[1050,280],[1730,300],[1780,300],[1830,300],[2300,330],[2350,330],[3000,290],[3050,290],[3100,290],[3500,320],[3550,320],[4200,280],[4250,280]].forEach(([x,y])=>blocks.push(rect(x,y,50,50,'question')));
      [[600,560],[670,560],[740,560],[1100,560],[1170,560],[1450,560],[1520,560],[1900,560],[1970,560],[2470,560],[2540,560],[3200,560],[3270,560],[3650,560],[3720,560],[4400,560]].forEach(([x,y])=>blocks.push(rect(x,y,50,50,'ground')));
      coins=[];[[460,250],[510,250],[560,250],[970,220],[1020,220],[1070,220],[1510,390],[1560,340],[1610,290],[1810,240],[1860,240],[2310,280],[2360,280],[3010,230],[3060,230],[3110,230],[3510,260],[3560,260],[4210,220],[4260,220]].forEach(([x,y])=>coins.push({x,y,r:13,got:false,phase:Math.random()*6}));
      enemies=[{x:690,y:562,w:38,h:42,vx:-1.1,dead:0},{x:1200,y:562,w:38,h:42,vx:-1,dead:0},{x:1740,y:562,w:38,h:42,vx:-1.2,dead:0},{x:2260,y:562,w:38,h:42,vx:-1,dead:0},{x:3150,y:562,w:38,h:42,vx:-1.3,dead:0},{x:3850,y:562,w:38,h:42,vx:-1.2,dead:0}];
      particles=[];score=0;coinCount=0;lives=3;view.x=0;paused=false;ended=false;hideModal();updateHud();
    }
    function updateHud(){document.getElementById('score').textContent=String(score).padStart(6,'0');document.getElementById('coins').textContent=String(coinCount).padStart(2,'0');document.getElementById('lives').textContent=String(lives).padStart(2,'0')}
    function solidAt(x,y,w,h){return blocks.find(b=>b.x<x+w&&b.x+b.w>x&&b.y<y+h&&b.y+b.h>y)}
    function jump(){if(!paused&&!ended&&player.onGround){player.vy=-14;player.onGround=false;burst(player.x+17,player.y+47,'#fff1b5',5)}}
    function hurt(){if(player.inv>0)return;lives--;updateHud();burst(player.x+17,player.y+20,'#e83232',14);if(lives<=0){end('游戏结束','玛丽需要休息一下！')}else{player.x=Math.max(100,player.x-240);player.y=400;player.vx=0;player.vy=-7;player.inv=2.1}}
    function end(title,text){ended=true;document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').textContent=text+'　最终得分：'+score;document.getElementById('modal').hidden=false}
    function hideModal(){document.getElementById('modal').hidden=true}
    function burst(x,y,color,n){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.8)*6,life:.7,color})}
    function update(dt){
      if(paused||ended)return;dt=Math.min(dt,.035);player.inv=Math.max(0,player.inv-dt);const left=keys.ArrowLeft||keys.a,right=keys.ArrowRight||keys.d;
      player.vx+=(right?0.65:0)-(left?0.65:0);if(!left&&!right)player.vx*=.82;player.vx=clamp(player.vx,-5.5,5.5);if(player.vx)player.face=Math.sign(player.vx);player.x+=player.vx;
      for(const b of blocks){if(player.x+player.w>b.x&&player.x<b.x+b.w&&player.y+player.h>b.y&&player.y<b.y+b.h){if(player.vx>0)player.x=b.x-player.w;else if(player.vx<0)player.x=b.x+b.w;player.vx=0}}
      player.x=clamp(player.x,0,world.w-player.w);player.vy+=.62;let oldY=player.y;player.y+=player.vy;player.onGround=false;
      for(const b of blocks){if(player.x+player.w>b.x&&player.x<b.x+b.w){if(player.vy>=0&&oldY+player.h<=b.y&&player.y+player.h>=b.y){player.y=b.y-player.h;player.vy=0;player.onGround=true}else if(player.vy<0&&oldY>=b.y+b.h&&player.y<=b.y+b.h){player.y=b.y+b.h;player.vy=1;if(b.type==='question'&&!b.hit){b.hit=true;coinCount++;score+=100;burst(b.x+25,b.y,'#ffc928',8)}}}}
      if(player.y>760){hurt();return}player.walk+=Math.abs(player.vx)*dt*2;
      for(const c of coins){if(!c.got&&player.x<c.x+c.r&&player.x+player.w>c.x-c.r&&player.y<c.y+c.r&&player.y+player.h>c.y-c.r){c.got=true;coinCount++;score+=100;burst(c.x,c.y,'#ffc928',9)}}
      for(const e of enemies){if(e.dead)continue;e.x+=e.vx;if(e.x<0||e.x>world.w-e.w)e.vx*=-1;const hit=player.x<e.x+e.w&&player.x+player.w>e.x&&player.y<e.y+e.h&&player.y+player.h>e.y;if(hit){if(player.vy>1&&player.y+player.h-e.y<24){e.dead=1;player.vy=-9;score+=200;burst(e.x+19,e.y+18,'#fff1b5',8)}else hurt()}}
      if(player.x>4610){score+=1000;updateHud();end('关卡完成！','你到达了旗杆！')}
      view.x+=(clamp(player.x-320,0,world.w-W)-view.x)*.12;for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.life-=dt}particles=particles.filter(p=>p.life>0);updateHud()
    }
    function draw(){const r=canvas.getBoundingClientRect();ctx.setTransform(r.width/W,0,0,r.height/H,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle='#73d9f5';ctx.fillRect(0,0,W,H);drawSky();ctx.save();ctx.translate(-view.x,0);drawWorld();drawPlayer();ctx.restore()}
    function drawSky(){ctx.fillStyle='#ffe77a';ctx.beginPath();ctx.arc(890,105,55,0,Math.PI*2);ctx.fill();for(let i=0;i<7;i++){const x=((i*263-view.x*.18)%1300)-100;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,170+i%2*90,28,0,Math.PI*2);ctx.arc(x+35,155+i%2*90,38,0,Math.PI*2);ctx.arc(x+75,175+i%2*90,25,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#62ce86';for(let i=-1;i<7;i++){const x=i*270-view.x*.35;ctx.beginPath();ctx.arc(x,575,180,Math.PI,0);ctx.fill()}ctx.fillStyle='#3cba70';for(let i=-1;i<7;i++){const x=i*310-view.x*.55;ctx.beginPath();ctx.arc(x,625,210,Math.PI,0);ctx.fill()}}
    function drawWorld(){ctx.fillStyle='#a96543';ctx.fillRect(0,610,world.w,90);ctx.fillStyle='#e7a363';for(let x=0;x<world.w;x+=100){ctx.fillRect(x,660,58,7)}for(const b of blocks)drawBlock(b);for(const c of coins)if(!c.got){ctx.save();ctx.translate(c.x,c.y+Math.sin(performance.now()/230+c.phase)*5);ctx.fillStyle='#ffc928';ctx.strokeStyle='#9a661b';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(0,0,11,16,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#fff19a';ctx.fillRect(-3,-10,5,20);ctx.restore()}for(const e of enemies)if(!e.dead)drawEnemy(e);drawPipe(1250,530);drawPipe(3650,530);drawFlag();for(const p of particles){ctx.globalAlpha=clamp(p.life/.7,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,6,6);ctx.globalAlpha=1}}
    function drawBlock(b){if(b.type==='pipe')return;if(b.type==='ground'){ctx.fillStyle='#bb713f';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#d88d4d';ctx.fillRect(b.x,b.y,b.w,8);return}ctx.fillStyle=b.type==='question'?(b.hit?'#a86b37':'#ffc928'):'#c65c38';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.strokeStyle='#713b2c';ctx.lineWidth=4;ctx.strokeRect(b.x+2,b.y+2,b.w-4,b.h-4);ctx.fillStyle='#ffe58a';if(b.type==='question'&&!b.hit){ctx.font='bold 30px system-ui';ctx.fillText('?',b.x+16,b.y+35)}else{ctx.fillRect(b.x+8,b.y+9,8,8);ctx.fillRect(b.x+34,b.y+9,8,8);ctx.fillRect(b.x+8,b.y+34,8,8);ctx.fillRect(b.x+34,b.y+34,8,8)}}
    function drawPipe(x,y){ctx.fillStyle='#2bad54';ctx.strokeStyle='#17243b';ctx.lineWidth=5;ctx.fillRect(x,y,85,80);ctx.strokeRect(x,y,85,80);ctx.fillStyle='#55d96e';ctx.fillRect(x+10,y+12,15,60);ctx.fillStyle='#3bc761';ctx.fillRect(x-10,y-18,105,28);ctx.strokeRect(x-10,y-18,105,28)}
    function drawEnemy(e){ctx.save();ctx.translate(e.x,e.y);ctx.fillStyle='#b85a3b';ctx.beginPath();ctx.arc(19,19,19,Math.PI,0);ctx.lineTo(38,42);ctx.lineTo(0,42);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(8,18,7,9);ctx.fillRect(24,18,7,9);ctx.fillStyle='#17243b';ctx.fillRect(11,20,4,7);ctx.fillRect(24,20,4,7);ctx.fillStyle='#fff';ctx.fillRect(3,39,11,5);ctx.fillRect(24,39,11,5);ctx.restore()}
    function drawFlag(){ctx.strokeStyle='#17243b';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(4620,610);ctx.lineTo(4620,350);ctx.stroke();ctx.fillStyle='#e83232';ctx.beginPath();ctx.moveTo(4620,355);ctx.lineTo(4710,380);ctx.lineTo(4620,415);ctx.closePath();ctx.fill();ctx.fillStyle='#fff1b5';ctx.beginPath();ctx.arc(4620,610,12,0,Math.PI*2);ctx.fill()}
    function drawPlayer(){if(player.inv>0&&Math.floor(player.inv*12)%2===0)return;ctx.save();ctx.translate(player.x+17,player.y+24);ctx.scale(player.face,1);ctx.fillStyle='#713b2b';ctx.fillRect(-17,17,17,10);ctx.fillStyle='#176dcc';ctx.fillRect(-14,-2,28,28);ctx.fillStyle='#e83232';ctx.fillRect(-19,-10,38,13);ctx.fillStyle='#f1a56f';ctx.beginPath();ctx.arc(0,-17,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e83232';ctx.fillRect(-19,-34,38,12);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-3,-28,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e83232';ctx.fillRect(-26,0,12,8);ctx.fillRect(14,0,12,8);ctx.fillStyle='#6a3826';ctx.fillRect(-12,-8,24,7);ctx.fillStyle='#17243b';ctx.fillRect(7,-20,4,5);ctx.fillStyle='#713b2b';ctx.fillRect(-14,26,12,8);ctx.fillRect(4,26,12,8);ctx.restore()}
    function loop(t){const dt=(t-last)/1000||0;last=t;update(dt);draw();requestAnimationFrame(loop)}
    function togglePause(){paused=!paused;document.getElementById('pause').textContent=paused?'▶ 继续':'Ⅱ 暂停'}
    addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','a','d','w','p','P','r','R'].includes(e.key))e.preventDefault();if(e.key===' '||e.key==='ArrowUp'||e.key==='w')jump();if(e.key==='p'||e.key==='P')togglePause();if(e.key==='r'||e.key==='R')reset();keys[e.key]=true});addEventListener('keyup',e=>keys[e.key]=false);
    document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key,down=e=>{e.preventDefault();if(k==='jump')jump();else keys[k==='left'?'ArrowLeft':'ArrowRight']=true},up=e=>{e.preventDefault();if(k!=='jump')keys[k==='left'?'ArrowLeft':'ArrowRight']=false};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)});
    document.getElementById('pause').onclick=togglePause;document.getElementById('restart').onclick=reset;document.getElementById('modalButton').onclick=reset;reset();requestAnimationFrame(loop);
  </script>
</body>
</html>
