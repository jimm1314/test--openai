<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕快线 · Pelican Express</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1230; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
  }
  .stage { position: fixed; inset: 0; }
  #scene { width: 100%; height: 100%; display: block; }
  #scene stop, #scene rect, #scene path, #scene circle, #scene ellipse, #scene line, #scene g {
    transition: fill .7s ease, stop-color .7s ease, stroke .7s ease;
  }
  .overlay {
    position: fixed; top: 22px; left: 26px; color: var(--text); z-index: 5;
    pointer-events: none; user-select: none;
  }
  .overlay h1 { font-size: 26px; letter-spacing: 1px; font-weight: 800; text-shadow: 0 2px 12px rgba(0,0,0,.25); }
  .overlay p { margin-top: 6px; font-size: 13px; opacity: .75; letter-spacing: .5px; }
  .controls {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 5;
  }
  .controls button {
    border: 1px solid rgba(255,255,255,.35); outline: none; cursor: pointer;
    background: rgba(12, 24, 38, .42); color: #fff; backdrop-filter: blur(8px);
    padding: 8px 16px; border-radius: 999px; font-size: 13px; letter-spacing: .5px;
    transition: transform .15s ease, background .2s ease;
  }
  .controls button:hover { background: rgba(12, 24, 38, .62); transform: translateY(-2px); }
  .hint {
    position: fixed; right: 22px; bottom: 22px; z-index: 5; color: var(--text);
    font-size: 12px; opacity: .55; pointer-events: none; user-select: none; letter-spacing: .5px;
  }
  :root {
    --text: #0e2f3f;
    --sky-1: #a5e2ff; --sky-2: #d9f4ff; --sky-3: #fff3d6;
    --sun-core: #ffe08a; --sun-ray: #ffd76a;
    --sea-1: #1f8fbd; --sea-2: #46b3d6; --sea-3: #93dcec;
    --sand: #ecd9a8; --sand-edge: #cfb578;
    --road-1: #59636d; --road-2: #39414a;
    --dash: #ffe9a8; --edge: #f4f7f8;
    --rail: #eef3f6;
    --palm-trunk: #8a5a33; --palm-leaf: #58ab5e; --palm-leaf-dark: #3e8a48;
    --cloud: #ffffff;
    --skin: #f7f4ec; --skin-shade: #e3e8ee; --skin-line: #c4ccd5; --feather-dark: #3c4450;
    --beak: #f6a623; --beak-line: #c97f16; --pouch: #ffd27a; --pouch-line: #d9a94e;
    --leg: #f2913c; --leg-dark: #d97c2c; --leg-line: #b4651f;
    --scarf: #e2564a; --scarf-dark: #c24034;
    --frame: #18a89c; --frame-dark: #0e7d74;
    --tire: #2f3b45; --rim: #cfd8dc; --spoke: #a9b7bf; --hub: #546e7a;
    --shadow: rgba(18, 32, 44, .30);
    --basket: #c98f4e; --basket-line: #9c6c33; --fish: #cfe3ee; --fish-line: #7fa9bd;
    --star-op: 0;
    --wave-c: rgba(255,255,255,.55);
  }
  body.night {
    --text: #dff1ff;
    --sky-1: #08102a; --sky-2: #14284a; --sky-3: #33436b;
    --sun-core: #e9edf5; --sun-ray: #b9c6dd;
    --sea-1: #08243c; --sea-2: #0f3a5c; --sea-3: #1b5478;
    --sand: #6d7686; --sand-edge: #55606e;
    --road-1: #2c333b; --road-2: #1a2027;
    --dash: #ffe9a8; --edge: #c7d3da;
    --rail: #8ea2b0;
    --palm-trunk: #453527; --palm-leaf: #2c6339; --palm-leaf-dark: #20492a;
    --cloud: #39507a;
    --skin: #e9edf3; --skin-shade: #c3ccd8; --skin-line: #9aa7b5; --feather-dark: #232a34;
    --beak: #e0952a; --beak-line: #a86a15; --pouch: #eec25f; --pouch-line: #b98e3e;
    --leg: #d9822f; --leg-dark: #b96a24; --leg-line: #93521a;
    --scarf: #c9453a; --scarf-dark: #a03428;
    --frame: #0e8578; --frame-dark: #0a635c;
    --tire: #1c242c; --rim: #8fa0aa; --spoke: #63737d; --hub: #33454f;
    --shadow: rgba(0, 0, 0, .45);
    --basket: #9a6c3c; --basket-line: #6f4c26; --fish: #9fc3d6; --fish-line: #5d89a0;
    --star-op: 1;
    --wave-c: rgba(190,220,255,.30);
  }
  .dashmove { animation: dashmove .55s linear infinite; }
  @keyframes dashmove { to { transform: translateX(-160px); } }
  .dashmove2 { animation: dashmove2 .38s linear infinite; }
  @keyframes dashmove2 { to { transform: translateX(-90px); } }
  .railmove { animation: railmove .5s linear infinite; }
  @keyframes railmove { to { transform: translateX(-80px); } }
  .wave1 { animation: wavedrift 7s linear infinite; }
  .wave2 { animation: wavedrift2 5s linear infinite; }
  .wave3 { animation: wavedrift3 9s linear infinite; }
  @keyframes wavedrift { to { transform: translateX(-240px); } }
  @keyframes wavedrift2 { to { transform: translateX(-160px); } }
  @keyframes wavedrift3 { to { transform: translateX(-200px); } }
  .grass { animation: grassmove .5s linear infinite; }
  @keyframes grassmove { to { transform: translateX(-300px); } }
  .rays { animation: spin 50s linear infinite; transform-origin: 1050px 120px; transform-box: view-box; }
  @keyframes spin { to { transform: rotate(360deg); } }
  body.night .rays { animation-duration: 90s; opacity: .25; }
  .stars { opacity: var(--star-op); transition: opacity 1s ease; }
  .star { fill: #fff; animation: twinkle 3.2s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  .clouda { animation: clouddrift 46s linear infinite; }
  .cloudb { animation: clouddrift 64s linear infinite; animation-delay: -22s; }
  .cloudc { animation: clouddrift 80s linear infinite; animation-delay: -50s; }
  .cloudd { animation: clouddrift 38s linear infinite; animation-delay: -8s; }
  @keyframes clouddrift { from { transform: translateX(1420px); } to { transform: translateX(-420px); } }
  .birda { animation: birdfly 30s linear infinite; }
  .birdb { animation: birdfly 44s linear infinite; animation-delay: -18s; }
  .birdc { animation: birdfly 36s linear infinite; animation-delay: -30s; }
  @keyframes birdfly { from { transform: translateX(1420px); } to { transform: translateX(-300px); } }
  .palma { animation: palmmove 16s linear infinite; }
  .palmb { animation: palmmove 21s linear infinite; animation-delay: -9s; }
  .palmc { animation: palmmove 26s linear infinite; animation-delay: -17s; }
  @keyframes palmmove { from { transform: translateX(1500px); } to { transform: translateX(-360px); } }
  .boata { animation: boatmove 34s linear infinite; }
  .boatb { animation: boatmove 48s linear infinite; animation-delay: -26s; }
  @keyframes boatmove { from { transform: translateX(1450px); } to { transform: translateX(-320px); } }
  .boatbob { animation: boatbob 3.4s ease-in-out infinite; }
  @keyframes boatbob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
  .speedline { animation: speedline .55s linear infinite; opacity: 0; }
  .speedline.s2 { animation-duration: .7s; animation-delay: -0.2s; }
  .speedline.s3 { animation-duration: .48s; animation-delay: -0.35s; }
  .speedline.s4 { animation-duration: .62s; animation-delay: -0.1s; }
  .speedline.s5 { animation-duration: .52s; animation-delay: -0.42s; }
  @keyframes speedline {
    0% { transform: translateX(0); opacity: 0; }
    12% { opacity: .8; }
    85% { opacity: .5; }
    100% { transform: translateX(-900px); opacity: 0; }
  }
  .paused .dashmove, .paused .dashmove2, .paused .railmove, .paused .grass,
  .paused .wave1, .paused .wave2, .paused .wave3, .paused .speedline,
  .paused .clouda, .paused .cloudb, .paused .cloudc, .paused .cloudd,
  .paused .birda, .paused .birdb, .paused .birdc,
  .paused .palma, .paused .palmb, .paused .palmc,
  .paused .boata, .paused .boatb, .paused .rays { animation-play-state: paused; }
</style>
</head>

    <defs>

        .road-s2 { stop-color: var(--road-2); }
        .body-s1 { stop-color: var(--skin); }
        .body-s2 { stop-color: var(--skin-shade); }

    </defs>

    <rect x="0" y="0" width="1280" height="470" fill="url(#skyGrad)" />
    <g class="stars" id="stars"></g>
    <g>

    <g class="clouda" opacity="0.95">

    <g class="birda" stroke="var(--feather-dark)" stroke-width="2.5" fill="none" stroke-linecap="round">

    <g id="rig">

<div class="overlay">
  <h1>鹈鹕快线</h1>
  <p>Pelican Express · 海边公路骑行中</p>
</div>
<div class="controls">
  <button id="btnPause">⏸ 暂停</button>
  <button id="btnSpeed">速度 1.0×</button>
  <button id="btnNight">🌙 夜间</button>
</div>
<div class="hint">空格 暂停 · S 变速 · N 昼夜</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var rig = $("rig"), bodyG = $("bodyG"), headG = $("headG"), wingG = $("wingG"), tailG = $("tailG");
  var wheelRear = $("wheelRear"), wheelFront = $("wheelFront"), gear = $("gear");
  var crankA = $("crankA"), crankB = $("crankB"), pedalA = $("pedalA"), pedalB = $("pedalB");
  var legFar = $("legFar"), legNear = $("legNear"), footFar = $("footFar"), footNear = $("footNear");
  var scarf = $("scarf"), scarf2 = $("scarf2"), fishTail = $("fishTail"), eyelid = $("eyelid"), shadow = $("shadow");
  var stars = $("stars");

  var BB = { x: 640, y: 600 }, CR = 24;
  var HIP = { near: { x: 628, y: 412 }, far: { x: 600, y: 400 } };
  var LEG = { near: { l1: 100, l2: 125 }, far: { l1: 105, l2: 130 } };

  var speeds = [0.5, 1, 1.6], speedIdx = 1;
  var paused = false, t = 0, last = performance.now();
  var wheelDeg = 0, crankDeg = 0;
  var nextBlink = 2 + Math.random() * 3, blinkLeft = 0;

  var starHTML = "";
  for (var i = 0; i < 70; i++) {
    var sx = Math.random() * 1280, sy = Math.random() * 430;
    var sr = 0.6 + Math.random() * 1.4;
    var dur = (2.2 + Math.random() * 3).toFixed(2);
    var del = (Math.random() * 3).toFixed(2);
    starHTML += '<circle class="star" cx="' + sx.toFixed(1) + '" cy="' + sy.toFixed(1) + '" r="' + sr.toFixed(2) + '" style="animation-duration:' + dur + 's;animation-delay:-' + del + 's"/>';
  }
  stars.innerHTML = starHTML;

  function solveIK(hx, hy, fx, fy, l1, l2) {
    var dx = fx - hx, dy = fy - hy;
    var d = Math.sqrt(dx * dx + dy * dy) || 0.001;
    var dmax = l1 + l2 - 0.5, dmin = Math.abs(l1 - l2) + 0.5;
    if (d > dmax) { fx = hx + dx / d * dmax; fy = hy + dy / d * dmax; d = dmax; dx = fx - hx; dy = fy - hy; }
    if (d < dmin) { fx = hx + dx / d * dmin; fy = hy + dy / d * dmin; d = dmin; dx = fx - hx; dy = fy - hy; }
    var a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    var ux = dx / d, uy = dy / d;
    var kx = hx + a * ux, ky = hy + a * uy;
    var c1x = kx - h * uy, c1y = ky + h * ux;
    var c2x = kx + h * uy, c2y = ky - h * ux;
    var knee = (c1x <= c2x) ? { x: c1x, y: c1y } : { x: c2x, y: c2y };
    return { knee: knee, fx: fx, fy: fy };
  }

  function drawLeg(pathEl, hip, foot, leg) {
    var r = solveIK(hip.x, hip.y, foot.x, foot.y, leg.l1, leg.l2);
    pathEl.setAttribute("d", "M " + hip.x.toFixed(1) + " " + hip.y.toFixed(1) +
      " L " + r.knee.x.toFixed(1) + " " + r.knee.y.toFixed(1) +
      " L " + r.fx.toFixed(1) + " " + r.fy.toFixed(1));
  }

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!paused) {
      t += dt * speeds[speedIdx];
      wheelDeg += dt * 430 * speeds[speedIdx];
      crankDeg += dt * 185 * speeds[speedIdx];
      nextBlink -= dt;
      if (nextBlink <= 0 && blinkLeft <= 0) { blinkLeft = 0.13; }
      if (blinkLeft > 0) {
        blinkLeft -= dt;
        if (blinkLeft <= 0) { nextBlink = 2.5 + Math.random() * 3.5; }
      }
    }
    eyelid.setAttribute("opacity", blinkLeft > 0 ? 1 : 0);

    var rad = crankDeg * Math.PI / 180;
    var rigBob = 1.8 * Math.sin(t * 4.4);
    var bodyBob = 2.4 * Math.sin(t * 4.4 + 0.9);
    var bodyRot = 2.2 * Math.sin(t * 2.2);
    var rigBobStr = rigBob.toFixed(2);

    rig.setAttribute("transform", "translate(0 " + rigBobStr + ")");
    bodyG.setAttribute("transform", "translate(0 " + bodyBob.toFixed(2) + ") rotate(" + bodyRot.toFixed(2) + " 598 362)");
    headG.setAttribute("transform", "rotate(" + (1.8 * Math.sin(t * 2.2 + 0.4)).toFixed(2) + " 720 250)");
    wingG.setAttribute("transform", "rotate(" + (8 * Math.sin(t * 5.6)).toFixed(2) + " 632 332)");
    tailG.setAttribute("transform", "rotate(" + (3 + 3 * Math.sin(t * 5.6 + 1)).toFixed(2) + " 528 352)");
    shadow.setAttribute("transform", "translate(655 662) translate(0 " + (rigBob * 0.4).toFixed(2) + ") scale(1 " + (1 - 0.035 * Math.sin(t * 4.4)).toFixed(3) + ") translate(-655 -662)");

    wheelRear.setAttribute("transform", "rotate(" + wheelDeg.toFixed(1) + " 545 575)");
    wheelFront.setAttribute("transform", "rotate(" + wheelDeg.toFixed(1) + " 775 575)");
    gear.setAttribute("transform", "rotate(" + crankDeg.toFixed(1) + " 640 600)");

    var pa = { x: BB.x + CR * Math.cos(rad), y: BB.y + CR * Math.sin(rad) };
    var pb = { x: BB.x - CR * Math.cos(rad), y: BB.y - CR * Math.sin(rad) };
    crankA.setAttribute("x2", pa.x.toFixed(1));
    crankA.setAttribute("y2", pa.y.toFixed(1));
    crankB.setAttribute("x2", pb.x.toFixed(1));
    crankB.setAttribute("y2", pb.y.toFixed(1));
    pedalA.setAttribute("transform", "translate(" + pa.x.toFixed(1) + " " + pa.y.toFixed(1) + ") rotate(" + (-crankDeg).toFixed(1) + ")");
    pedalB.setAttribute("transform", "translate(" + pb.x.toFixed(1) + " " + pb.y.toFixed(1) + ") rotate(" + (-crankDeg).toFixed(1) + ")");

    var footNearPos = { x: pa.x + 4, y: pa.y - 6, rot: -crankDeg + 6 * Math.sin(t * 9) };
    var footFarPos = { x: pb.x + 4, y: pb.y - 6, rot: -crankDeg + 6 * Math.sin(t * 9 + 1.7) };
    drawLeg(legNear, { x: HIP.near.x, y: HIP.near.y + bodyBob }, footNearPos, LEG.near);
    drawLeg(legFar, { x: HIP.far.x, y: HIP.far.y }, footFarPos, LEG.far);
    footNear.setAttribute("transform", "translate(" + footNearPos.x.toFixed(1) + " " + footNearPos.y.toFixed(1) + ") rotate(" + footNearPos.rot.toFixed(1) + ")");
    footFar.setAttribute("transform", "translate(" + footFarPos.x.toFixed(1) + " " + footFarPos.y.toFixed(1) + ") rotate(" + footFarPos.rot.toFixed(1) + ")");

    var d1 = "M 712 254", d2 = "M 714 258";
    for (var k = 1; k <= 7; k++) {
      var wy = 254 + 12 + Math.sin(t * 7 - k * 0.9) * 7 * (k * 0.16) + k * k * 0.5;
      var wy2 = 258 + 16 + Math.sin(t * 7 - k * 0.9 + 0.7) * 8 * (k * 0.16) + k * k * 0.5;
      d1 += " L " + (712 - k * 25) + " " + wy.toFixed(1);
      d2 += " L " + (714 - k * 25) + " " + wy2.toFixed(1);
    }
    scarf.setAttribute("d", d1);
    scarf2.setAttribute("d", d2);

    fishTail.setAttribute("transform", "translate(880 206) rotate(" + (18 * Math.sin(t * 8)).toFixed(1) + ")");

    requestAnimationFrame(frame);
  }

  var btnPause = $("btnPause"), btnSpeed = $("btnSpeed"), btnNight = $("btnNight");

  btnPause.addEventListener("click", function () {
    paused = !paused;
    document.body.classList.toggle("paused", paused);
    btnPause.textContent = paused ? "▶ 播放" : "⏸ 暂停";
  });
  btnSpeed.addEventListener("click", function () {
    speedIdx = (speedIdx + 1) % speeds.length;
    btnSpeed.textContent = "速度 " + speeds[speedIdx].toFixed(1) + "×";
  });
  btnNight.addEventListener("click", function () {
    document.body.classList.toggle("night");
    btnNight.textContent = document.body.classList.contains("night") ? "☀️ 白天" : "🌙 夜间";
  });
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space") { e.preventDefault(); btnPause.click(); }
    else if (e.key === "s" || e.key === "S") { btnSpeed.click(); }
    else if (e.key === "n" || e.key === "N") { btnNight.click(); }
  });

  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    paused = true;
    document.body.classList.add("paused");
    btnPause.textContent = "▶ 播放";
  }

  requestAnimationFrame(frame);
})();
</script>
