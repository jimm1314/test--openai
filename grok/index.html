<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑自行车</title>
  <style>
    :root {
      --sky-top: #7ec8e3;
      --sky-mid: #c5e8f7;
      --sky-bot: #f6e7c1;
      --road: #4a4a4a;
      --road-line: #f4d35e;
      --grass: #6bbf59;
      --grass-dark: #4ea03d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      background: #111;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-bot) 72%, #d9c48a 100%);
      overflow: hidden;
    }

    .sun {
      position: absolute;
      top: 7%;
      right: 12%;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff6c2, #ffd166 45%, #f4a261 80%);
      box-shadow: 0 0 40px 16px rgba(255, 209, 102, 0.55);
      animation: pulse 4s ease-in-out infinite;
    }

    .cloud {
      position: absolute;
      background: #fff;
      border-radius: 40px;
      opacity: 0.92;
      filter: drop-shadow(0 8px 6px rgba(80, 120, 160, 0.12));
    }
    .cloud::before, .cloud::after {
      content: "";
      position: absolute;
      background: #fff;
      border-radius: 50%;
    }
    .c1 { width: 140px; height: 42px; top: 12%; left: -20%; animation: drift 28s linear infinite; }
    .c1::before { width: 54px; height: 54px; top: -28px; left: 22px; }
    .c1::after  { width: 70px; height: 70px; top: -38px; left: 58px; }
    .c2 { width: 180px; height: 48px; top: 22%; left: -30%; animation: drift 36s linear infinite 6s; opacity: 0.8; }
    .c2::before { width: 64px; height: 64px; top: -32px; left: 28px; }
    .c2::after  { width: 86px; height: 86px; top: -46px; left: 72px; }
    .c3 { width: 110px; height: 34px; top: 8%; left: -15%; animation: drift 22s linear infinite 12s; }
    .c3::before { width: 42px; height: 42px; top: -22px; left: 16px; }
    .c3::after  { width: 52px; height: 52px; top: -28px; left: 48px; }

    .hills {
      position: absolute;
      bottom: 22%;
      width: 200%;
      height: 28%;
      background:
        radial-gradient(ellipse 40% 90% at 10% 100%, #8bc34a 0 70%, transparent 71%),
        radial-gradient(ellipse 50% 110% at 35% 100%, #7cb342 0 70%, transparent 71%),
        radial-gradient(ellipse 42% 95% at 60% 100%, #9ccc65 0 70%, transparent 71%),
        radial-gradient(ellipse 48% 105% at 85% 100%, #8bc34a 0 70%, transparent 71%);
      animation: scroll-hills 40s linear infinite;
    }

    .trees {
      position: absolute;
      bottom: 22%;
      width: 300%;
      height: 26%;
      animation: scroll-trees 18s linear infinite;
      pointer-events: none;
    }
    .tree {
      position: absolute;
      bottom: 0;
      width: 18px;
      background: #6d4c41;
    }
    .tree::before {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 100%;
      width: 0; height: 0;
      border-left: 34px solid transparent;
      border-right: 34px solid transparent;
      border-bottom: 78px solid #2e7d32;
    }
    .tree.t1 { left: 8%; height: 70px; }
    .tree.t2 { left: 22%; height: 92px; }
    .tree.t2::before { border-left-width: 42px; border-right-width: 42px; border-bottom: 96px solid #388e3c; }
    .tree.t3 { left: 38%; height: 60px; }
    .tree.t4 { left: 55%; height: 84px; }
    .tree.t4::before { border-bottom-color: #1b5e20; }
    .tree.t5 { left: 70%; height: 75px; }
    .tree.t6 { left: 88%; height: 98px; }

    .ground {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 22%;
      background: linear-gradient(#5d9c46 0 12%, var(--road) 12% 78%, #3a3a3a 78% 100%);
    }

    .road-line {
      position: absolute;
      bottom: 11%;
      left: 0;
      width: 200%;
      height: 8px;
      background: repeating-linear-gradient(90deg, var(--road-line) 0 70px, transparent 70px 130px);
      animation: scroll-road 0.7s linear infinite;
    }

    .grass-tufts {
      position: absolute;
      bottom: 20.2%;
      width: 200%;
      height: 18px;
      background: repeating-linear-gradient(90deg,
        transparent 0 40px,
        #4caf50 40px 46px,
        transparent 46px 90px,
        #66bb6a 90px 95px,
        transparent 95px 140px);
      animation: scroll-road 1.4s linear infinite;
    }

    .scene {
      position: absolute;
      left: 50%;
      bottom: 14%;
      width: 520px;
      height: 360px;
      transform: translateX(-50%);
      z-index: 5;
    }

    .bob {
      width: 100%;
      height: 100%;
      animation: bob 0.45s ease-in-out infinite;
      transform-origin: 50% 85%;
    }

    svg.ride {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .wheel { transform-origin: center; animation: spin 0.55s linear infinite; }
    .crank { transform-origin: 250px 268px; animation: spin 0.55s linear infinite; }
    .pedal-l { transform-origin: 250px 268px; animation: spin 0.55s linear infinite; }
    .pedal-r { transform-origin: 250px 268px; animation: spin 0.55s linear infinite reverse; }

    .leg-front { transform-origin: 238px 210px; animation: pedal-front 0.55s linear infinite; }
    .leg-back  { transform-origin: 238px 210px; animation: pedal-back 0.55s linear infinite; }

    .wing {
      transform-origin: 210px 150px;
      animation: flap 1.1s ease-in-out infinite;
    }

    .beak {
      transform-origin: 330px 148px;
      animation: beak 2.4s ease-in-out infinite;
    }

    .eye-shine { animation: blink 3.6s ease-in-out infinite; }

    .dust {
      position: absolute;
      left: 18%;
      bottom: 8%;
      width: 90px;
      height: 28px;
      pointer-events: none;
    }
    .puff {
      position: absolute;
      bottom: 0;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: rgba(180, 160, 120, 0.45);
      animation: puff 0.7s linear infinite;
    }
    .puff:nth-child(2) { left: 22px; animation-delay: 0.18s; width: 14px; height: 14px; }
    .puff:nth-child(3) { left: 44px; animation-delay: 0.36s; width: 8px; height: 8px; }

    .title {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      color: #1d3557;
      font-size: clamp(22px, 4vw, 40px);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-shadow: 0 3px 0 rgba(255,255,255,0.55);
      z-index: 8;
      white-space: nowrap;
    }
    .sub {
      position: absolute;
      top: 78px;
      left: 50%;
      transform: translateX(-50%);
      color: #315072;
      font-size: 14px;
      z-index: 8;
      opacity: 0.85;
    }

    .hint {
      position: absolute;
      right: 24px;
      bottom: 24px;
      z-index: 9;
      background: rgba(255,255,255,0.78);
      border: 2px solid #1d3557;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 13px;
      color: #1d3557;
      cursor: pointer;
      user-select: none;
      box-shadow: 3px 3px 0 #1d3557;
    }
    .hint:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #1d3557; }

    .paused .wheel,
    .paused .crank,
    .paused .pedal-l,
    .paused .pedal-r,
    .paused .leg-front,
    .paused .leg-back,
    .paused .wing,
    .paused .beak,
    .paused .bob,
    .paused .road-line,
    .paused .grass-tufts,
    .paused .hills,
    .paused .trees,
    .paused .cloud,
    .paused .puff,
    .paused .sun {
      animation-play-state: paused;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }
    @keyframes flap {
      0%, 100% { transform: rotate(8deg); }
      50% { transform: rotate(-18deg); }
    }
    @keyframes beak {
      0%, 70%, 100% { transform: rotate(0deg); }
      78% { transform: rotate(-8deg); }
      86% { transform: rotate(4deg); }
    }
    @keyframes blink {
      0%, 92%, 100% { opacity: 1; }
      94%, 96% { opacity: 0; }
    }
    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(140vw); }
    }
    @keyframes scroll-road {
      from { transform: translateX(0); }
      to { transform: translateX(-130px); }
    }
    @keyframes scroll-hills {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
    @keyframes scroll-trees {
      from { transform: translateX(0); }
      to { transform: translateX(-33.33%); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    @keyframes puff {
      0% { transform: translate(0, 0) scale(0.6); opacity: 0.5; }
      100% { transform: translate(-40px, -18px) scale(1.4); opacity: 0; }
    }
    @keyframes pedal-front {
      0%   { transform: rotate(20deg); }
      50%  { transform: rotate(-25deg); }
      100% { transform: rotate(20deg); }
    }
    @keyframes pedal-back {
      0%   { transform: rotate(-25deg); }
      50%  { transform: rotate(20deg); }
      100% { transform: rotate(-25deg); }
    }

    @media (max-width: 640px) {
      .scene { width: 92vw; height: 64vw; bottom: 16%; }
      .sub { display: none; }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="hills"></div>
    <div class="trees">
      <div class="tree t1"></div>
      <div class="tree t2"></div>
      <div class="tree t3"></div>
      <div class="tree t4"></div>
      <div class="tree t5"></div>
      <div class="tree t6"></div>
      <div class="tree t1" style="left:108%"></div>
      <div class="tree t2" style="left:122%"></div>
      <div class="tree t3" style="left:138%"></div>
      <div class="tree t4" style="left:155%"></div>
      <div class="tree t5" style="left:170%"></div>
      <div class="tree t6" style="left:188%"></div>
    </div>
    <div class="ground"></div>
    <div class="grass-tufts"></div>
    <div class="road-line"></div>

    <h1 class="title">鹈鹕骑自行车</h1>
    <p class="sub">风很大，但它很坚定</p>

    <div class="scene">
      <div class="bob">
        <svg class="ride" viewBox="0 0 520 360" xmlns="http://www.w3.org/2000/svg">
          <!-- shadow -->
          <ellipse cx="250" cy="318" rx="150" ry="14" fill="rgba(0,0,0,0.18)" />

          <!-- bike frame -->
          <g stroke="#1d3557" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <path d="M140 268 L250 268 L210 175 L140 268" />
            <path d="M250 268 L330 175 L210 175" />
            <path d="M330 175 L360 268" />
            <path d="M210 175 L188 128" />
            <path d="M168 128 H230" />
            <path d="M330 175 L318 128 H292" />
          </g>
          <!-- saddle -->
          <ellipse cx="196" cy="122" rx="26" ry="10" fill="#e63946" stroke="#1d3557" stroke-width="4" />
          <!-- handlebar grips -->
          <rect x="278" y="118" width="22" height="12" rx="6" fill="#457b9d" stroke="#1d3557" stroke-width="3" />
          <rect x="310" y="118" width="22" height="12" rx="6" fill="#457b9d" stroke="#1d3557" stroke-width="3" />

          <!-- rear wheel -->
          <g class="wheel">
            <circle cx="140" cy="268" r="52" fill="#f1faee" stroke="#1d3557" stroke-width="8" />
            <circle cx="140" cy="268" r="10" fill="#e63946" stroke="#1d3557" stroke-width="3" />
            <g stroke="#1d3557" stroke-width="3" opacity="0.7">
              <line x1="140" y1="216" x2="140" y2="320" />
              <line x1="88" y1="268" x2="192" y2="268" />
              <line x1="103" y1="231" x2="177" y2="305" />
              <line x1="177" y1="231" x2="103" y2="305" />
            </g>
          </g>

          <!-- front wheel -->
          <g class="wheel">
            <circle cx="360" cy="268" r="52" fill="#f1faee" stroke="#1d3557" stroke-width="8" />
            <circle cx="360" cy="268" r="10" fill="#e63946" stroke="#1d3557" stroke-width="3" />
            <g stroke="#1d3557" stroke-width="3" opacity="0.7">
              <line x1="360" y1="216" x2="360" y2="320" />
              <line x1="308" y1="268" x2="412" y2="268" />
              <line x1="323" y1="231" x2="397" y2="305" />
              <line x1="397" y1="231" x2="323" y2="305" />
            </g>
          </g>

          <!-- crank / pedals -->
          <g class="crank">
            <line x1="250" y1="268" x2="250" y2="238" stroke="#1d3557" stroke-width="6" stroke-linecap="round" />
            <rect x="238" y="228" width="24" height="10" rx="4" fill="#f4a261" stroke="#1d3557" stroke-width="3" />
            <line x1="250" y1="268" x2="250" y2="298" stroke="#1d3557" stroke-width="6" stroke-linecap="round" />
            <rect x="238" y="296" width="24" height="10" rx="4" fill="#f4a261" stroke="#1d3557" stroke-width="3" />
            <circle cx="250" cy="268" r="9" fill="#e63946" stroke="#1d3557" stroke-width="3" />
          </g>

          <!-- pelican body -->
          <g>
            <!-- tail -->
            <path d="M150 168 Q118 150 108 178 Q138 172 158 186 Z" fill="#f4a261" stroke="#1d3557" stroke-width="4" />
            <!-- body -->
            <ellipse cx="210" cy="168" rx="78" ry="48" fill="#f1faee" stroke="#1d3557" stroke-width="5" />
            <!-- belly -->
            <ellipse cx="222" cy="182" rx="46" ry="28" fill="#ffe8d6" opacity="0.9" />

            <!-- back wing -->
            <path class="wing" d="M186 150 Q150 110 118 148 Q158 138 190 162 Z" fill="#a8dadc" stroke="#1d3557" stroke-width="4" />

            <!-- legs -->
            <g class="leg-back" stroke="#e76f51" stroke-width="8" stroke-linecap="round" fill="none">
              <path d="M228 206 L236 248" />
            </g>
            <g class="leg-front" stroke="#f4a261" stroke-width="8" stroke-linecap="round" fill="none">
              <path d="M246 204 L252 248" />
            </g>

            <!-- neck -->
            <path d="M268 150 Q292 132 308 148 Q292 168 262 166" fill="#f1faee" stroke="#1d3557" stroke-width="5" />

            <!-- head -->
            <circle cx="322" cy="138" r="32" fill="#f1faee" stroke="#1d3557" stroke-width="5" />
            <!-- crest -->
            <path d="M300 112 Q312 88 334 104" fill="none" stroke="#e63946" stroke-width="6" stroke-linecap="round" />

            <!-- beak pouch -->
            <g class="beak">
              <path d="M346 138 Q410 128 430 158 Q392 186 348 160 Z" fill="#f4a261" stroke="#1d3557" stroke-width="4" />
              <path d="M346 138 L428 150" stroke="#e76f51" stroke-width="7" stroke-linecap="round" />
              <!-- fish in pouch -->
              <ellipse cx="392" cy="158" rx="16" ry="8" fill="#457b9d" stroke="#1d3557" stroke-width="2" />
              <polygon points="376,158 366,152 366,164" fill="#1d3557" />
            </g>

            <!-- eye -->
            <circle cx="328" cy="132" r="8" fill="#1d3557" />
            <circle class="eye-shine" cx="331" cy="129" r="3" fill="#fff" />

            <!-- front wing -->
            <path class="wing" d="M198 158 Q230 118 268 152 Q230 148 200 172 Z" fill="#457b9d" stroke="#1d3557" stroke-width="4" />
          </g>
        </svg>
      </div>
      <div class="dust">
        <span class="puff"></span>
        <span class="puff"></span>
        <span class="puff"></span>
      </div>
    </div>

    <button class="hint" id="toggle" type="button">暂停 / 继续</button>
  </div>

  <script>
    const stage = document.getElementById("stage");
    const btn = document.getElementById("toggle");
    btn.addEventListener("click", () => {
      stage.classList.toggle("paused");
      btn.textContent = stage.classList.contains("paused") ? "继续骑行" : "暂停 / 继续";
    });
  </script>
</body>
</html>
